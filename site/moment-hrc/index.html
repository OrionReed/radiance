<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moment HRC</title>
    <meta name="description" content="HRC with exact falloff, b-type rays, l-system lines, etc." />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --bg: #0e0e0e;
        --panel: #151515;
        --line: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.82);
        --dim: rgba(255, 255, 255, 0.45);
        --faint: rgba(255, 255, 255, 0.28);
        --ctl: rgba(255, 255, 255, 0.06);
        --ctl-hover: rgba(255, 255, 255, 0.11);
        --on: #d8d8d8;
        --on-text: #111;
        --accent: #7fc8a9;
        --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', ui-monospace, monospace;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr) 252px;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #canvas-area {
        position: relative;
        min-width: 0;
        overflow: hidden;
      }

      /* ── Panels ── */
      aside {
        position: relative;
        z-index: 10;
        background: var(--panel);
        overflow-y: auto;
        scrollbar-width: thin;
        user-select: none;
        display: flex;
        flex-direction: column;
      }
      #left {
        border-right: 1px solid var(--line);
      }
      #right {
        border-left: 1px solid var(--line);
      }
      section {
        padding: 12px 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      section > h2 {
        margin: 0 0 10px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--dim);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      section > h2 small {
        font-weight: 400;
        letter-spacing: 0;
        text-transform: none;
        color: var(--faint);
        font-family: var(--mono);
      }
      .field {
        margin-top: 10px;
      }
      .field:first-of-type {
        margin-top: 0;
      }
      .field > .label {
        font-size: 11px;
        color: var(--dim);
        margin-bottom: 4px;
        display: flex;
        justify-content: space-between;
      }
      .field > .label .val {
        font-family: var(--mono);
        color: var(--text);
      }
      .field.disabled {
        opacity: 0.35;
        pointer-events: none;
      }
      kbd {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--faint);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 3px;
        line-height: 14px;
      }

      /* segmented pick-one */
      .seg {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 2px;
        background: var(--ctl);
        border-radius: 6px;
        padding: 2px;
      }
      .seg.wrap {
        grid-auto-flow: row;
        grid-template-columns: repeat(var(--cols, 3), 1fr);
      }
      .seg button {
        font: inherit;
        font-size: 11px;
        color: var(--dim);
        background: none;
        border: 0;
        border-radius: 4px;
        padding: 4px 2px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .seg button:hover {
        color: var(--text);
        background: var(--ctl-hover);
      }
      .seg button.on {
        background: var(--on);
        color: var(--on-text);
      }

      /* on/off toggle */
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        font: inherit;
        color: var(--text);
        background: none;
        border: 0;
        padding: 5px 0;
        cursor: pointer;
        text-align: left;
      }
      .toggle .sw {
        flex: none;
        width: 26px;
        height: 14px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.14);
        position: relative;
        transition: background 0.12s;
      }
      .toggle .sw::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
        transition: transform 0.12s;
      }
      .toggle.on .sw {
        background: var(--accent);
      }
      .toggle.on .sw::after {
        transform: translateX(12px);
        background: #fff;
      }
      .toggle .name {
        flex: 1;
      }
      .toggle:hover .name {
        color: #fff;
      }

      /* scene list */
      #scene-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px 2px;
      }
      #scene-list .group {
        grid-column: 1 / -1;
        font-size: 10px;
        color: var(--faint);
        margin: 7px 0 1px;
      }
      #scene-list .group:first-child {
        margin-top: 0;
      }
      #scene-list button {
        font: inherit;
        text-align: left;
        color: var(--dim);
        background: none;
        border: 0;
        border-radius: 4px;
        padding: 3px 4px;
        cursor: pointer;
        display: flex;
        gap: 4px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
      }
      #scene-list button .idx {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--faint);
        width: 13px;
        flex: none;
        text-align: right;
        line-height: 16px;
      }
      #scene-list button:hover {
        background: var(--ctl);
        color: var(--text);
      }
      #scene-list button.on {
        background: var(--on);
        color: var(--on-text);
      }
      #scene-list button.on .idx {
        color: rgba(0, 0, 0, 0.5);
      }

      /* sliders */
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 16px;
        background: transparent;
        outline: none;
        cursor: pointer;
        margin: 0;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 3px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 2px;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        border: none;
        margin-top: -4.5px;
      }
      input[type='range']::-moz-range-track {
        height: 3px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 2px;
      }
      input[type='range']::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        border: none;
      }

      .hint {
        margin-top: 8px;
        font-size: 10.5px;
        color: var(--faint);
      }

      /* legend */
      #legend {
        margin-top: 10px;
      }
      #legend .bar {
        height: 10px;
        border-radius: 2px;
      }
      #legend .ticks {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 9px;
        color: var(--faint);
        margin-top: 2px;
      }
      #legend .caption {
        font-size: 10.5px;
        color: var(--faint);
        margin-top: 4px;
      }

      /* status / tools */
      #tools {
        margin-top: auto;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        border-bottom: 0;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #tools button {
        font: inherit;
        font-size: 11px;
        color: var(--dim);
        background: var(--ctl);
        border: 0;
        border-radius: 4px;
        padding: 3px 7px;
        cursor: pointer;
      }
      #tools button:hover {
        color: var(--text);
        background: var(--ctl-hover);
      }
      #tools button.on {
        background: var(--on);
        color: var(--on-text);
      }
      #fps {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        margin-right: auto;
      }


      /* help + perf overlays (inside the canvas area) */
      #help {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 20;
        background: rgba(12, 12, 12, 0.94);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        display: none;
        min-width: 230px;
        font-size: 11px;
        line-height: 1.75;
      }
      #help.open {
        display: block;
      }
      #help .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      #help .row span:last-child {
        color: var(--dim);
      }
      #perf-graph {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 20;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 6px;
        display: none;
        flex-direction: column;
        font-family: var(--mono);
        font-size: 9px;
        color: rgba(255, 255, 255, 0.5);
        pointer-events: none;
        overflow: hidden;
      }
      #perf-graph.open {
        display: flex;
      }
      #perf-graph .perf-stats {
        display: flex;
        gap: 12px;
        padding: 6px 8px 4px;
        font-size: 10px;
      }

      /* the cascade's square (one canvas pixel per cell, scaled with nearest-neighbour sampling) */
      #view {
        position: absolute;
        image-rendering: pixelated;
        touch-action: none;
        cursor: crosshair;
      }
      #view.grab {
        cursor: grab;
      }
      #view.grabbing {
        cursor: grabbing;
      }
      #error {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        color: var(--dim);
        padding: 24px;
        text-align: center;
      }
      #error.open {
        display: grid;
      }
    </style>
  </head>
  <body>
    <aside id="left">
      <section>
        <h2>scene <small id="scene-id"></small></h2>
        <div id="scene-list"></div>
      </section>
      <section>
        <div id="scene-params"></div>
      </section>
      <section id="pen">
        <h2><span id="pen-title">pen</span> <small id="pen-sub">draw on the canvas</small></h2>
        <div id="pen-fields"></div>
        <div id="size-field"></div>
        <div class="hint">light = glowing, see-through · solid light = glowing and opaque (for now a dense medium, σ ≤ 8 per cell) · wall = opaque · medium = partly absorbing · drag a shape to move it · the cursor previews the pen</div>
      </section>
    </aside>

    <div id="canvas-area">
      <canvas id="view"></canvas>
      <div id="perf-graph">
        <div class="perf-stats">
          <span id="perf-fps" style="color: rgba(255, 255, 255, 0.7)"></span>
          <span id="perf-cpu-val" style="color: rgba(100, 200, 255, 0.9)"></span>
          <span id="perf-gpu-val" style="color: rgba(255, 150, 80, 0.9)"></span>
        </div>
        <canvas id="perf-canvas"></canvas>
      </div>
      <div id="help"></div>
      <div id="error"></div>
    </div>

    <aside id="right">
      <section>
        <h2>cascade <small id="casc-info"></small></h2>
        <div id="features"></div>
      </section>
      <section>
        <h2>output</h2>
        <div id="output"></div>
        <div id="legend"></div>
      </section>
      <section id="tools">
        <span id="fps" title="cascade frame: scene upload + four frustums + draw, submit to done (recomputed only when the scene changes); click for the perf graph" style="cursor: pointer"></span>
        <button id="bench-btn" title="time this N in this browser: cascade passes alone, a full frame, the draw alone (console has the table)">bench</button>
        <button id="shot-btn" title="screenshot (s)">shot</button>
        <button id="help-btn" title="keyboard shortcuts (?)">?</button>
      </section>
    </aside>

    <script type="module">
      // Moment HRC: interactive page (the cascade is website/demos/shaders/moment-hrc.js; research in research/director_notes).
      // Layout and controls follow the old hrc-ratio page; no dependencies besides the cascade module.
      // Scenes are plain data (rectangles in scene units), rasterised on the CPU into emission E and transmittance A.
      import { MomentHRC } from './moment-hrc.js';

      const $ = (id) => document.getElementById(id);
      const el = (tag, props = {}, ...children) => {
        const e = Object.assign(document.createElement(tag), props);
        e.append(...children);
        return e;
      };
      const view = $('view');

      // ════════════════════════════════════════════════════════════════════
      // State. cfg rebuilds the cascade when it changes; out only redraws.
      // ════════════════════════════════════════════════════════════════════
      const cfg = { N: 512, fam: 'lbal', f16: false };
      const out = { view: 'fluence', map: 'tone', exposure: 2, dither: true, tint: false };
      let dirty = true, redraw = true;
      const touch = () => (dirty = true);

      // ════════════════════════════════════════════════════════════════════
      // Controls: a toggle is an independent on/off; a segmented control picks one of several.
      // Each spec: { label, get(), set(v), enabled?(), key?, title?, url?: [name, default] }.
      // ════════════════════════════════════════════════════════════════════
      const controls = [];
      const field = (obj, name, after = touch) => ({ get: () => obj[name], set: (v) => ((obj[name] = v), after()) });

      function toggle(parent, spec) {
        const sw = el('span', { className: 'sw' });
        const b = el('button', { className: 'toggle', title: spec.title ?? '' }, sw, el('span', { className: 'name', textContent: spec.label }));
        if (spec.key) b.append(el('kbd', { textContent: spec.key }));
        b.addEventListener('click', () => {
          spec.set(!spec.get());
          changed();
        });
        const wrap = el('div', { className: 'field' }, b);
        parent.append(wrap);
        controls.push({ spec, sync: () => b.classList.toggle('on', !!spec.get()), wrap });
      }

      function segmented(parent, spec) {
        const seg = el('div', { className: 'seg' + (spec.cols ? ' wrap' : '') });
        if (spec.cols) seg.style.setProperty('--cols', spec.cols);
        const buttons = spec.options.map(([value, text, title]) => {
          const b = el('button', { textContent: text, title: title ?? text });
          b.addEventListener('click', () => {
            spec.set(value);
            changed();
          });
          seg.append(b);
          return [value, b];
        });
        let wrap = seg;
        if (spec.label) {
          const label = el('div', { className: 'label' }, el('span', { textContent: spec.label }));
          if (spec.key) label.append(el('kbd', { textContent: spec.key }));
          wrap = el('div', { className: 'field', title: spec.title ?? '' }, label, seg);
        }
        parent.append(wrap);
        controls.push({ spec, sync: () => buttons.forEach(([v, b]) => b.classList.toggle('on', v === spec.get())), wrap });
      }

      function slider(parent, spec) {
        const val = el('span', { className: 'val' });
        const input = el('input', { type: 'range', min: spec.min, max: spec.max, step: spec.step });
        input.addEventListener('input', () => {
          spec.set(Number(input.value));
          changed();
        });
        const wrap = el('div', { className: 'field', title: spec.title ?? '' }, el('div', { className: 'label' }, el('span', { textContent: spec.label }), val), input);
        parent.append(wrap);
        controls.push({
          spec,
          sync: () => {
            input.value = spec.get();
            val.textContent = spec.format ? spec.format(spec.get()) : spec.get();
          },
          wrap,
        });
      }

      function refresh() {
        for (const c of controls) {
          c.sync();
          if (c.spec.enabled) c.wrap.classList.toggle('disabled', !c.spec.enabled());
        }
        renderLegend();
      }
      function changed() {
        refresh();
        syncURL();
      }

      // ════════════════════════════════════════════════════════════════════
      // Materials, in the square-pixel (px-box) model. Mono: a colour's luminance S is the material's radiance (its source
      // function). Opacity is per reference cell (N = 256), so a scene looks the same at every N: extinction per cell
      // σ = −ln(1 − opacity) · 256/N, A = e^−σ, emission density E = S σ, so a thick block glows with radiance S.
      // An opaque emitter is the σ → ∞ limit of that, which a cell cannot hold: it is capped at σ = 8 per reference cell.
      // Opacity 0 is a volumetric light: E = S per reference cell length.
      // ════════════════════════════════════════════════════════════════════
      const presets = [
        { name: 'Eraser', css: null, rgb: [0, 0, 0] },
        { name: 'Black', css: '#000', rgb: [0, 0, 0] },
        { name: 'Red', css: '#ff4444', rgb: [1, 0.25, 0.25] },
        { name: 'Orange', css: '#ff8833', rgb: [1, 0.5, 0.2] },
        { name: 'Yellow', css: '#dddd33', rgb: [0.75, 0.75, 0.2] },
        { name: 'Green', css: '#44dd55', rgb: [0.25, 0.8, 0.35] },
        { name: 'Cyan', css: '#44dddd', rgb: [0.25, 0.75, 0.75] },
        { name: 'Blue', css: '#4466ff', rgb: [0.3, 0.4, 1] },
        { name: 'Purple', css: '#aa44ff', rgb: [0.65, 0.3, 1] },
        { name: 'White', css: '#ffffff', rgb: [0.8, 0.8, 0.8] },
      ];
      const lum = ([r, g, b]) => 0.2126 * r + 0.7152 * g + 0.0722 * b;
      const REF = 256, SIG_CAP = 8;
      const material = (rgb, opacity, N) => {
        const S = lum(rgb);
        if (opacity <= 0) return { e: (S * REF) / N, a: 1 };
        const sigRef = opacity >= 1 ? (S > 0 ? SIG_CAP : Infinity) : Math.min(-Math.log(1 - opacity), S > 0 ? SIG_CAP : Infinity);
        const sig = (sigRef * REF) / N, a = Math.exp(-sig);
        return { e: S > 0 ? S * sig : 0, a };
      };

      // ════════════════════════════════════════════════════════════════════
      // Scenes: a registry. Coordinates are scene units with the origin at the square's centre and
      // 1024 units across (1 unit = 1 cell at N = 1024), independent of N and of the window.
      //   scene(group, name, build)   build(ctx) with ctx.add(x, y, w, h, colour, opts) → shape, ctx.shapes([...])
      // A shape is { x, y, w, h, rgb, opacity } (top-left, y down).
      // ════════════════════════════════════════════════════════════════════
      const SPAN = 1024;
      let shapes = [], strokes = [];
      const scenes = [];
      const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const scene = (group, name, build) => scenes.push({ id: slug(name), group, name, build });

      function sceneContext() {
        const add = (x, y, w, h, colour, opts = {}) => {
          const s = { x, y, w, h, rgb: opts.color ?? [...(presets[colour]?.rgb ?? [0, 0, 0])], opacity: opts.opacity ?? 1 };
          shapes.push(s);
          return s;
        };
        return { add, shapes: (list) => list.map(([x, y, w, h, c, o]) => add(x, y, w, h, c, o)) };
      }

      // ── Scene definitions ── shapes are [x, y, w, h, colourIndex, opts?] (top-left, scene units)
      const V0 = { opacity: 0 }; // volumetric light
      const PINHOLE = [
        [-200, -84, 16, 24, 2], [-200, -60, 16, 24, 3], [-200, -36, 16, 24, 4], [-200, -12, 16, 24, 5],
        [-200, 12, 16, 24, 6], [-200, 36, 16, 24, 7], [-200, 60, 16, 24, 8],
        [-5, -500, 8, 488, 1], [-5, 12, 8, 500, 1],
      ];
      // until solid lights are settled: every opaque light (a coloured shape at full opacity) is drawn as its volume
      // equivalent; scenes that had one are also listed with their solid lights in the last section, for testing
      const isSolidLight = ([, , , , colour, opts]) => colour >= 2 && (opts?.opacity ?? 1) >= 1;
      const asVolume = (list) => list.map((s) => (isSolidLight(s) ? [...s.slice(0, 5), V0] : s));
      const solidScenes = [];
      const staticScene = (group, name, list) => {
        scene(group, name, (c) => c.shapes(asVolume(list)));
        if (list.some(isSolidLight)) solidScenes.push([name, list]);
      };

      staticScene('volumetric lights', 'Point + wall', [[180, 0, 4, 4, 9, V0], [-200, -60, 40, 160, 1], [-60, 40, 14, 14, 1]]);
      staticScene('volumetric lights', 'Three lights', [[180, -2, 4, 4, 9, V0], [200, -80, 6, 6, 3, V0], [240, 70, 8, 8, 6, V0], [-30, -10, 40, 20, 1]]);
      staticScene('volumetric lights', 'Vol room', [
        [-250, -200, 500, 12, 1], [-250, 188, 500, 12, 1], [-250, -200, 12, 400, 1], [238, -200, 12, 400, 1],
        [-120, -120, 8, 8, 9, V0], [120, 90, 6, 6, 3, V0], [-20, -20, 60, 40, 1], [60, -140, 8, 120, 1],
      ]);
      // the old research page's scene: a light behind a wall with a gap, an absorbing box, a second light
      staticScene('volumetric lights', 'Gap + box', [
        [-8, -8, 16, 16, 9, V0], [192, -320, 16, 272, 1], [192, 48, 16, 272, 1], [-352, -240, 192, 16, 1],
        [-256, 128, 160, 160, 0, { opacity: 0.2 }], [352, -328, 16, 16, 0, { color: [0.6, 0.6, 0.6], opacity: 0 }],
      ]);

      staticScene('occluders', 'Pinhole', PINHOLE);
      staticScene('occluders', 'Center block', [[-60, -60, 120, 120, 1]]);
      staticScene('occluders', 'Thin walls', [[200, -10, 20, 20, 9], [-200, -80, 400, 1, 1], [-200, -20, 400, 2, 1], [-200, 40, 400, 4, 1], [-200, 110, 400, 8, 1]]);
      staticScene('occluders', 'Two lights', [[-200, -100, 40, 40, 2], [-200, 60, 40, 40, 7], [-40, -80, 20, 160, 1], [100, -120, 10, 240, 9]]);
      staticScene('occluders', 'Slats', [
        [-300, -30, 30, 60, 9], ...Array.from({ length: 9 }, (_, i) => [-40, -200 + i * 48, 12, 24, 1]), [150, -60, 4, 120, 1],
      ]);

      staticScene('media', 'Glowing fog', [
        [-200, -40, 60, 60, 9], [-80, -100, 60, 200, 2, { opacity: 0.015 }],
        [-10, -100, 60, 200, 5, { opacity: 0.015 }], [60, -100, 60, 200, 7, { opacity: 0.015 }], [180, -40, 40, 80, 1],
      ]);
      staticScene('media', 'Fog room', [
        [-250, -200, 500, 15, 1], [-250, 185, 500, 15, 1], [-250, -200, 15, 400, 1], [235, -200, 15, 400, 1],
        [-200, -185, 30, 30, 3], [170, 155, 30, 30, 6], [-100, -50, 200, 100, 0, { opacity: 0.01 }],
      ]);
      staticScene('media', 'Smoke', [[-30, 80, 60, 30, 3], [-80, -100, 160, 160, 0, { opacity: 0.05 }], [-200, -60, 30, 30, 1], [170, -60, 30, 30, 1]]);
      staticScene('media', 'Absorbers', [
        [-260, -20, 30, 40, 9], ...[0.02, 0.05, 0.1, 0.2, 0.4, 0.7].map((o, i) => [-180 + i * 70, -120, 40, 240, 0, { opacity: o }]),
      ]);

      scene('empty', 'Empty', () => {});
      for (const [name, list] of solidScenes) scene('solid lights (testing)', `${name} (solid)`, (c) => c.shapes(list));

      // ── Scene switching ──
      let currentScene = 0;
      const sceneButtons = [];
      function switchScene(index) {
        currentScene = (index + scenes.length) % scenes.length;
        document.activeElement?.blur();
        shapes = [];
        strokes = [];
        selectShape(null);
        scenes[currentScene].build(sceneContext());
        sceneButtons.forEach((b, i) => b.classList.toggle('on', i === currentScene));
        $('scene-id').textContent = scenes[currentScene].id;
        touch();
        syncURL();
      }
      {
        const list = $('scene-list');
        let group = null;
        scenes.forEach((s, i) => {
          if (s.group !== group) list.append(el('div', { className: 'group', textContent: (group = s.group) }));
          const b = el('button', { title: s.id }, el('span', { className: 'idx', textContent: i }), el('span', { textContent: s.name }));
          b.addEventListener('click', () => {
            switchScene(i);
            changed();
          });
          list.append(b);
          sceneButtons.push(b);
        });
      }

      // ════════════════════════════════════════════════════════════════════
      // Rasterisation: scene units → cells. Cell (gx, gy) with gy down is index gx·N + (N − 1 − gy) (y up).
      // A rectangle covers the cells whose centres it contains, at least one; strokes stamp size × size squares.
      // ════════════════════════════════════════════════════════════════════
      let E = null, A = null, cursor = null;
      const raster = { subpixel: true };
      function rasterise(N) {
        E.fill(0);
        A.fill(1);
        const k = N / SPAN, g = (u) => (u + SPAN / 2) * k;
        const cellIndex = (gx, gy) => (gx < 0 || gy < 0 || gx >= N || gy >= N ? -1 : gx * N + (N - 1 - gy));
        // whole cells: the material replaces what is there
        const put = (gx, gy, m) => {
          const i = cellIndex(gx, gy);
          if (i >= 0) ((E[i] = m.e), (A[i] = m.a));
        };
        // subpixel: the material covers a fraction c of the cell. Emission mixes by area and media by optical depth.
        // Opaque material (walls, solid lights) takes the whole cell when it covers the centre, else nothing: averaging
        // its transmittance would let light through a thin wall (two half-covered cells pass 25 %, the wall passes 0).
        const OPAQUE = 0.01;
        const over = (i, m, c, centre) => {
          if (m.a < OPAQUE) return centre ? ((E[i] = m.e), (A[i] = m.a)) : undefined;
          E[i] = E[i] * (1 - c) + m.e * c;
          if (A[i] >= OPAQUE) A[i] = A[i] ** (1 - c) * m.a ** c;
        };
        const overlap = (a0, a1, c) => Math.max(0, Math.min(a1, c + 1) - Math.max(a0, c));
        const coverBox = (x0, x1, y0, y1, cover) => {
          for (let x = Math.floor(x0); x < Math.ceil(x1); x++)
            for (let y = Math.floor(y0); y < Math.ceil(y1); y++) {
              const c = overlap(x0, x1, x) * overlap(y0, y1, y), i = cellIndex(x, y);
              const centre = x + 0.5 >= x0 && x + 0.5 < x1 && y + 0.5 >= y0 && y + 0.5 < y1;
              if (c > 0 && i >= 0) cover(i, c, centre);
            }
        };
        // a brush of `size` cells swept from a to b: each cell takes its largest coverage along the way
        const sweep = (ax, ay, bx, by, size, m) => {
          if (!raster.subpixel) {
            const lo = (c) => Math.round(c - size / 2), n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) * 2)), sz = Math.max(1, Math.round(size));
            for (let t = 0; t <= n; t++) {
              const cx = ax + ((bx - ax) * t) / n, cy = ay + ((by - ay) * t) / n;
              for (let x = lo(cx); x < lo(cx) + sz; x++) for (let y = lo(cy); y < lo(cy) + sz; y++) put(x, y, m);
            }
            return;
          }
          const cov = new Map(), n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) * 4)), h = size / 2;
          for (let t = 0; t <= n; t++) {
            const cx = ax + ((bx - ax) * t) / n, cy = ay + ((by - ay) * t) / n;
            coverBox(cx - h, cx + h, cy - h, cy + h, (i, c, centre) => {
              const [c0, in0] = cov.get(i) ?? [0, false];
              cov.set(i, [Math.max(c, c0), centre || in0]);
            });
          }
          for (const [i, [c, centre]] of cov) over(i, m, c, centre);
        };
        for (const s of shapes) {
          const m = material(s.rgb, s.opacity, N);
          let [x0, x1, y0, y1] = [g(s.x), g(s.x + s.w), g(s.y), g(s.y + s.h)];
          // opaque shapes are at least one cell thick (thinner would cover no cell centre)
          const widen = (a, b) => (b - a >= 1 ? [a, b] : [(a + b) / 2 - 0.5, (a + b) / 2 + 0.5]);
          if (m.a < OPAQUE || !raster.subpixel) [[x0, x1], [y0, y1]] = [widen(x0, x1), widen(y0, y1)];
          if (raster.subpixel) {
            coverBox(x0, x1, y0, y1, (i, c, centre) => over(i, m, c, centre));
            continue;
          }
          for (let x = Math.round(x0); x < Math.round(x1); x++) for (let y = Math.round(y0); y < Math.round(y1); y++) put(x, y, m);
        }
        for (const s of strokes) sweep(g(s.x0), g(s.y0), g(s.x1), g(s.y1), s.size * k, material(s.rgb, s.opacity, N));
        if (cursor && pen.kind !== 'eraser' && !drag) {
          const m = penMaterial(), cx = g(cursor[0]), cy = g(cursor[1]);
          sweep(cx, cy, cx, cy, pen.size, material(m.rgb, m.opacity, N));
        }
      }

      // ════════════════════════════════════════════════════════════════════
      // Pen / shape inspector
      // ════════════════════════════════════════════════════════════════════
      // A pen is a kind plus brightness (radiance) and opacity; shapes and strokes store { rgb, opacity } (mono: rgb grey).
      const KINDS = [
        ['light', 'light', 'glowing, see-through (opacity 0)'],
        ['solid', 'solid light', 'glowing and opaque'],
        ['wall', 'wall', 'opaque, dark'],
        ['medium', 'medium', 'partly absorbing'],
        ['eraser', 'eraser', 'erase strokes'],
      ];
      const pen = { kind: 'light', brightness: 0.8, opacity: 0.1, size: 2 };
      let selected = null;
      const kindOf = (m) => (m.opacity <= 0 ? 'light' : m.opacity < 1 ? 'medium' : lum(m.rgb) > 0 ? 'solid' : 'wall');
      const materialOf = ({ kind, brightness: b, opacity }) => {
        const grey = (v) => [v, v, v];
        if (kind === 'light') return { rgb: grey(b), opacity: 0 };
        if (kind === 'solid') return { rgb: grey(b), opacity: 1 };
        if (kind === 'wall') return { rgb: grey(0), opacity: 1 };
        return { rgb: grey(0), opacity }; // medium: absorbing only (glowing media come from scenes)
      };
      const penMaterial = () => materialOf(pen);
      const shapeState = (s) => ({ kind: kindOf(s), brightness: lum(s.rgb), opacity: s.opacity });
      const PEN_SIZES = [1, 2, 4, 8, 16, 32]; // cells of the N × N grid
      const setPenSize = (v) => ((pen.size = v), touch(), refresh());
      const stepPenSize = (d) => setPenSize(PEN_SIZES[Math.max(0, Math.min(PEN_SIZES.length - 1, PEN_SIZES.indexOf(pen.size) + d))] ?? 2);
      const setPen = (key, v) => {
        if (selected) {
          const st = { ...shapeState(selected), [key]: v };
          if (key === 'kind' && st.kind === 'medium' && !(st.opacity > 0 && st.opacity < 1)) st.opacity = pen.opacity;
          if (key === 'kind' && st.kind !== 'wall' && st.brightness <= 0 && st.kind !== 'medium') st.brightness = pen.brightness;
          if (st.kind !== 'eraser') (Object.assign(selected, materialOf(st)), touch());
        } else ((pen[key] = v), touch());
      };
      const penGet = (key) => (selected ? shapeState(selected)[key] : pen[key]);
      segmented($('pen-fields'), { cols: 3, options: KINDS, get: () => penGet('kind'), set: (k) => setPen('kind', k) });
      slider($('pen-fields'), {
        label: 'brightness',
        title: 'radiance of the light (mono)',
        min: 0, max: 2, step: 0.01,
        get: () => penGet('brightness'), set: (v) => setPen('brightness', v), format: (v) => v.toFixed(2),
        enabled: () => ['light', 'solid'].includes(penGet('kind')),
      });
      slider($('pen-fields'), {
        label: 'opacity (per reference cell)',
        min: 0, max: 1, step: 0.01,
        get: () => Math.cbrt(penGet('opacity')), set: (v) => setPen('opacity', Math.min(0.99, Math.max(0.001, v ** 3))),
        format: (v) => { const o = v ** 3; return o < 0.1 ? o.toFixed(3) : o.toFixed(2); },
        enabled: () => penGet('kind') === 'medium',
      });
      function syncPen() {
        $('pen-title').textContent = selected ? 'shape' : 'pen';
        $('pen-sub').textContent = selected ? 'selected · ⌫ deletes · esc' : 'draw on the canvas';
        $('size-field').style.display = selected ? 'none' : '';
        refresh();
      }
      function selectShape(s) {
        selected = s;
        syncPen();
      }

      // ════════════════════════════════════════════════════════════════════
      // Panels
      // ════════════════════════════════════════════════════════════════════
      const PROBES = [64, 128, 256, 512, 1024];
      segmented($('scene-params'), { label: 'cells (N × N, one per pixel)', options: PROBES.map((n) => [n, String(n)]), ...field(cfg, 'N'), url: ['N', 512] });
      toggle($('scene-params'), {
        label: 'subpixel',
        title: 'lights and media cover cells by area (they move smoothly instead of snapping); opaque material still takes whole cells, by their centres',
        ...field(raster, 'subpixel'),
        url: ['subpixel', true],
      });
      segmented($('size-field'), { label: 'size (cells)', options: PEN_SIZES.map((n) => [n, String(n)]), get: () => pen.size, set: setPenSize });

      const F = $('features');
      segmented(F, {
        label: 'line family',
        title: 'stateless digital lines: lbal = unbiased (mean offset 0 at every level), lsym = the earlier rounding family',
        options: [['lbal', 'lbal (unbiased)'], ['lsym', 'lsym']],
        ...field(cfg, 'fam'),
        url: ['fam', 'lbal'],
      });

      const O = $('output');
      const redrawOnly = () => (redraw = true);
      segmented(O, { label: 'view', key: 'v', title: 'fluence, or the rasterised scene (emission warm, absorption grey)', options: [['fluence', 'fluence'], ['scene', 'scene']], ...field(out, 'view', redrawOnly), url: ['view', 'fluence'] });
      segmented(O, { label: 'map', key: 'b', options: [['tone', 'tonemap'], ['banded', 'banded'], ['fc', 'false colour']], ...field(out, 'map', redrawOnly), url: ['map', 'tone'] });
      slider(O, {
        label: 'exposure',
        title: 'shown: mean radiance L = fluence / 2π, times the exposure (tonemap 1 − e^−L); banded and false colour show log10(L · exposure)',
        min: -1,
        max: 3,
        step: 0.05, // slider in log10(exposure)
        get: () => Math.log10(out.exposure),
        set: (v) => ((out.exposure = +(10 ** v).toPrecision(3)), redrawOnly()),
        format: (v) => String(+(10 ** v).toPrecision(3)),
      });
      toggle(O, { label: 'material tint', key: 'm', title: 'emitters red, occluders and media blue (by how much of the cell they cover)', ...field(out, 'tint', redrawOnly), url: ['tint', false] });
      toggle(O, { label: 'dither', title: 'display only: ±1 LSB triangular noise per screen pixel before 8-bit output, removes banding', ...field(out, 'dither', redrawOnly), url: ['dither', true] });

      // ── Legend (viridis, same samples as the draw shader) ──
      const VIRIDIS = [
        [0.267, 0.0049, 0.3294], [0.2823, 0.095, 0.4173], [0.2788, 0.1755, 0.4834], [0.259, 0.2515, 0.5247],
        [0.2297, 0.3224, 0.5457], [0.1994, 0.3876, 0.5546], [0.1727, 0.4488, 0.5579], [0.149, 0.5081, 0.5573],
        [0.1276, 0.5669, 0.5506], [0.1206, 0.6258, 0.5335], [0.1579, 0.6838, 0.5017], [0.2461, 0.7389, 0.452],
        [0.3692, 0.7889, 0.3829], [0.516, 0.8312, 0.2943], [0.6785, 0.8637, 0.1895], [0.8456, 0.8873, 0.0997],
        [0.9932, 0.9062, 0.1439],
      ];
      const viridis = (t) => {
        const s = Math.max(0, Math.min(1, t)) * 16, i = Math.min(Math.floor(s), 15), f = s - i;
        return `rgb(${VIRIDIS[i].map((a, k) => Math.round((a + (VIRIDIS[i + 1][k] - a) * f) * 255)).join(',')})`;
      };
      function renderLegend() {
        const L = $('legend');
        L.innerHTML = '';
        if (out.view !== 'fluence' || out.map === 'tone') return;
        const stops = [];
        let ticks, caption;
        if (out.map === 'banded') {
          for (let i = 0; i < 22; i++) stops.push(`${viridis(i / 21)} ${(i / 22) * 100}% ${((i + 1) / 22) * 100}%`);
          ticks = ['−2.2', '−1.65', '−1.1', '−0.55', '0'];
          caption = 'log10(L · exposure), L = fluence / 2π, 10 bands per decade; opaque black, emitters red';
        } else {
          for (let i = 0; i <= 16; i++) stops.push(viridis(i / 16));
          ticks = ['10⁻⁴', '10⁻³', '10⁻²', '10⁻¹', '1+'];
          caption = 'L · exposure, L = fluence / 2π (log scale); opaque black, emitters red';
        }
        const b = el('div', { className: 'bar' });
        b.style.background = `linear-gradient(to right, ${stops.join(',')})`;
        L.append(b, el('div', { className: 'ticks' }, ...ticks.map((t) => el('span', { textContent: t }))), el('div', { className: 'caption', textContent: caption }));
      }

      // ════════════════════════════════════════════════════════════════════
      // URL state: every control with url: [name, default] round-trips; plus scene and perf.
      // ════════════════════════════════════════════════════════════════════
      const enc = (v) => (v === true ? '1' : v === false ? '0' : String(v));
      const dec = (s, def) => (typeof def === 'boolean' ? s === '1' : typeof def === 'number' ? Number(s) : s);
      let perfOpen = false, urlReady = false;
      function syncURL() {
        if (!urlReady) return;
        const p = new URLSearchParams();
        if (currentScene !== 0) p.set('scene', scenes[currentScene].id);
        for (const { spec } of controls) {
          if (!spec.url) continue;
          const [name, def] = spec.url, v = spec.get();
          if (v !== def) p.set(name, typeof v === 'number' && !Number.isInteger(v) ? String(+v.toFixed(3)) : enc(v));
        }
        if (out.exposure !== 2) p.set('exposure', String(out.exposure));
        if (perfOpen) p.set('perf', '1');
        const qs = p.toString();
        history.replaceState(null, '', qs ? '?' + qs : location.pathname);
      }
      function loadURL() {
        const p = new URLSearchParams(location.search);
        for (const { spec } of controls) {
          if (!spec.url) continue;
          const [name, def] = spec.url;
          spec.set(p.has(name) ? dec(p.get(name), def) : def);
        }
        if (!PROBES.includes(cfg.N)) cfg.N = 512;
        out.exposure = Number(p.get('exposure')) || 2;
        perfOpen = p.get('perf') === '1';
        const s = p.get('scene') ?? '0';
        const byId = scenes.findIndex((x) => x.id === s);
        return byId >= 0 ? byId : Number.isFinite(Number(s)) ? Number(s) : 0;
      }

      // ════════════════════════════════════════════════════════════════════
      // WebGPU: the cascade (rebuilt when cfg changes) and a draw pass straight from its output buffer.
      // ════════════════════════════════════════════════════════════════════
      const fail = (msg) => {
        $('error').textContent = msg;
        $('error').classList.add('open');
      };
      const adapter = await navigator.gpu?.requestAdapter();
      if (!adapter) {
        fail('WebGPU is not available in this browser.');
        throw new Error('no WebGPU');
      }
      const device = await adapter.requestDevice({
        requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize },
      });
      device.addEventListener('uncapturederror', (e) => {
        console.error(e.error.message);
        fail(e.error.message);
      });
      const ctx = view.getContext('webgpu');
      const format = navigator.gpu.getPreferredCanvasFormat();
      ctx.configure({ device, format, alphaMode: 'opaque' });

      const drawModule = device.createShaderModule({
        code: /* wgsl */ `
        @group(0) @binding(0) var<storage, read> F: array<f32>;
        @group(0) @binding(1) var<storage, read> A: array<f32>;
        @group(0) @binding(2) var<storage, read> E: array<f32>;
        struct Draw {
          P: vec4f,   // N, exposure / 2π (fluence → mean radiance), map (0 tone, 1 banded, 2 false colour), view (0 fluence, 1 scene)
          Q: vec4f,   // canvas size in device pixels, dither (0 / 1), tint materials (0 / 1)
        }
        @group(0) @binding(3) var<uniform> D: Draw;
        const VIR = array<vec3f, 17>(${VIRIDIS.map((c) => `vec3f(${c.join(', ')})`).join(', ')});
        fn viridis(t: f32) -> vec3f {
          let s = clamp(t, 0.0, 1.0) * 16.0; let i = min(u32(s), 15u);
          return mix(VIR[i], VIR[i + 1u], s - f32(i));
        }
        fn srgb(c: vec3f) -> vec3f { return select(1.055 * pow(c, vec3f(1.0 / 2.4)) - 0.055, 12.92 * c, c <= vec3f(0.0031308)); }
        @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
          let p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0)); return vec4f(p[i], 0.0, 1.0);
        }
        // display dither: triangular noise of ±1 LSB of the 8-bit output, per device pixel (removes banding, mean 0)
        fn hash(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(12.9898, 78.233))) * 43758.5453); }
        fn dither(c: vec3f, q: vec2f) -> vec4f {
          let n = (hash(q) + hash(q + vec2f(17.3, 5.1)) - 1.0) / 255.0;
          return vec4f(c + n * D.Q.z, 1.0);
        }
        @fragment fn fs(@builtin(position) q: vec4f) -> @location(0) vec4f {
          let P = D.P;
          let N = i32(P.x); let cell = vec2i(floor(q.xy / D.Q.xy * P.x));
          let i = cell.x * N + (N - 1 - cell.y);
          let a = A[i]; let e = E[i]; let f = max(F[i], 0.0) * P.y;
          var S = 0.0;   // the material's radiance, from E and A (see material() in the page)
          if (e > 0.0) { S = select(e, e / max(-log(a), 1e-6), a < 1.0); }
          let opaque = a <= 0.0 || (e > 0.0 && a < 0.05);   // walls, and dense emitters drawn as surfaces of radiance S
          if (P.w > 0.5) {   // the rasterised scene
            var c = vec3f(0.04) + vec3f(0.55) * (1.0 - a);
            if (e > 0.0) { c = vec3f(1.0, 0.75, 0.4) * min(1.0, 0.25 + select(e, S, a < 1.0)); }
            return vec4f(c, 1.0);
          }
          if (P.z > 0.5) {   // banded / false colour
            if (opaque) { return vec4f(select(vec3f(0.0), vec3f(0.85, 0.15, 0.1), e > 0.0), 1.0); }
            let lv = log(max(f, 1e-9)) / log(10.0);
            var t = (lv + 4.0) / 4.0;
            if (P.z < 1.5) { t = (floor(lv * 10.0) / 10.0 + 2.2) / 2.2; }
            return dither(srgb(viridis(t)), q.xy);
          }
          let tint = D.Q.w > 0.5;   // emitters red, occluders blue, by how much of each the cell holds
          if (opaque) {   // surfaces: their own emission, walls dark slate
            if (e > 0.0) { return vec4f(select(srgb(vec3f(min(1.0, S * 1.25))), vec3f(1.0, 0.2, 0.15), tint), 1.0); }
            return vec4f(select(vec3f(0.11, 0.115, 0.13), vec3f(0.15, 0.3, 1.0), tint), 1.0);
          }
          var c = srgb(vec3f(1.0 - exp(-f)));
          if (tint) {
            if (e > 0.0) { c = mix(c, vec3f(1.0, 0.2, 0.15), 0.7); }
            else if (a < 1.0) { c = mix(c, vec3f(0.15, 0.3, 1.0), 0.25 + 0.6 * (1.0 - a)); }
          } else if (a < 1.0) { c = mix(c, c * vec3f(0.8, 0.88, 1.0), 0.5); }   // media slightly cool
          return dither(c, q.xy);
        }`,
      });
      const drawPipe = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: drawModule, entryPoint: 'vs' },
        fragment: { module: drawModule, entryPoint: 'fs', targets: [{ format }] },
        primitive: { topology: 'triangle-list' },
      });
      const drawU = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

      let cascade = null, cascadeKey = '', drawBG = null;
      function engine() {
        const key = JSON.stringify(cfg);
        if (key === cascadeKey) return cascade;
        if (cascade) for (const v of Object.values(cascade)) if (v instanceof GPUBuffer) v.destroy();
        const N = cfg.N;
        cascade = new MomentHRC(device, N, { abs: 'sec', f16: cfg.f16, fam: cfg.fam }); // abs: until the reference drops the point convention
        cascadeKey = key;
        E = new Float32Array(N * N);
        A = new Float32Array(N * N);
        drawBG = device.createBindGroup({
          layout: drawPipe.getBindGroupLayout(0),
          entries: [cascade.bufOut, cascade.bufA, cascade.bufE, drawU].map((buffer, binding) => ({ binding, resource: { buffer } })),
        });
        const mb = (cascade.bufRays.size + cascade.bufCar.size) / 2 ** 20;
        $('casc-info').textContent = `${N}² · ${mb.toFixed(0)} MB`;
        layout();
        return cascade;
      }
      function encodeDraw(enc, g) {
        const mapId = { tone: 0, banded: 1, fc: 2 }[out.map];
        device.queue.writeBuffer(drawU, 0, new Float32Array([
          g.N, out.exposure / (2 * Math.PI), mapId, out.view === 'scene' ? 1 : 0,
          view.width, view.height, out.dither ? 1 : 0, out.tint ? 1 : 0,
        ]));
        const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
        pass.setPipeline(drawPipe);
        pass.setBindGroup(0, drawBG);
        pass.draw(3);
        pass.end();
      }

      // ── layout: the largest square in the canvas area, 32 px margin ──
      const squareRect = () => view.getBoundingClientRect();
      function layout() {
        const r = $('canvas-area').getBoundingClientRect();
        const d = Math.max(64, Math.floor(Math.min(r.width - 64, r.height - 64)));
        Object.assign(view.style, { width: d + 'px', height: d + 'px', left: Math.floor((r.width - d) / 2) + 'px', top: Math.floor((r.height - d) / 2) + 'px' });
        view.width = view.height = Math.round(d * (window.devicePixelRatio || 1)); // drawn at device resolution: crisp cells, per-pixel dither
        redraw = true;
      }
      window.addEventListener('resize', layout);

      // ── frame loop: recompute only when the scene changed, redraw when the output settings changed ──
      let busy = false, cpuMs = 0, gpuMs = 0, solves = 0, frameMs = 0, solveN = 0;
      async function frame() {
        requestAnimationFrame(frame);
        if (busy || !(dirty || redraw)) return;
        busy = true;
        const solve = dirty;
        dirty = redraw = false;
        const fresh = cascade === null || JSON.stringify(cfg) !== cascadeKey;
        const g = engine();
        const t0 = performance.now();
        const enc = device.createCommandEncoder();
        if (solve) {
          rasterise(g.N);
          g.upload(E, A);
          g.encodeAll(enc);
        }
        const t1 = performance.now();
        encodeDraw(enc, g);
        device.queue.submit([enc.finish()]);
        await device.queue.onSubmittedWorkDone();
        if (solve && !fresh) {   // the first solve after a rebuild includes pipeline compilation
          cpuMs = t1 - t0;
          gpuMs = performance.now() - t1;
          frameMs = solveN === g.N ? frameMs + (cpuMs + gpuMs - frameMs) * 0.3 : cpuMs + gpuMs;   // restart at a new N
          solveN = g.N;
          solves++;
        }
        busy = false;
      }

      // ════════════════════════════════════════════════════════════════════
      // Tools: fps / perf, screenshot, help
      // ════════════════════════════════════════════════════════════════════
      function screenshot() {
        const g = engine(), enc = device.createCommandEncoder();
        encodeDraw(enc, g);
        device.queue.submit([enc.finish()]);
        view.toBlob((b) => b && Object.assign(document.createElement('a'), { href: URL.createObjectURL(b), download: `moment-hrc-${scenes[currentScene].id}-${g.N}-${Date.now()}.png` }).click());
      }
      $('shot-btn').addEventListener('click', screenshot);

      // bench: each case 20 times, waiting for the GPU each time (latency, as an interactive frame sees it)
      let benching = false;
      async function bench() {
        if (benching) return;
        benching = true;
        while (busy) await new Promise((r) => setTimeout(r, 5));
        busy = true;
        fpsEl.textContent = 'benching…';
        const g = engine(), reps = 20;
        const time = async (fn) => {
          await device.queue.onSubmittedWorkDone();
          const t0 = performance.now();
          for (let r = 0; r < reps; r++) {
            const enc = device.createCommandEncoder();
            fn(enc);
            device.queue.submit([enc.finish()]);
            await device.queue.onSubmittedWorkDone();
          }
          return (performance.now() - t0) / reps;
        };
        rasterise(g.N);
        g.upload(E, A); // the current scene (the cascade's cost depends on its content)
        await time((enc) => g.encodeAll(enc)); // warm-up
        const passes = await time((enc) => g.encodeAll(enc));
        const frame = await time((enc) => (rasterise(g.N), g.upload(E, A), g.encodeAll(enc), encodeDraw(enc, g)));
        const draw = await time((enc) => encodeDraw(enc, g));
        const upload = await time(() => g.upload(E, A));
        let t0 = performance.now();
        for (let r = 0; r < reps; r++) rasterise(g.N);
        const raster = (performance.now() - t0) / reps;
        const r = { N: g.N, 'passes (ms)': +passes.toFixed(2), 'full frame (ms)': +frame.toFixed(2), 'draw only (ms)': +draw.toFixed(2),
          'upload (ms)': +upload.toFixed(2), 'raster, CPU (ms)': +raster.toFixed(2), canvas: `${view.width}²` };
        console.table([r]);
        fpsEl.textContent = `${g.N}²: passes ${passes.toFixed(1)} · frame ${frame.toFixed(1)} (raster ${raster.toFixed(1)}, upload ${upload.toFixed(1)}) ms`;
        busy = false;
        setTimeout(() => (benching = false), 6000); // keep the result on screen for a while
      }
      $('bench-btn').addEventListener('click', bench);

      const KEYS = [
        ['← →', 'previous / next scene'],
        ['⇧ 0–9', 'scene 0–9'],
        ['1–5', 'pen: light, solid light, wall, medium, eraser'],
        ['+ −', 'pen size'],
        ['v', 'fluence / scene view'],
        ['b', 'banded view'],
        ['m', 'material tint (emitters red, occluders blue)'],
        ['n', 'new shape'],
        ['⌫', 'delete selected shape'],
        ['c', 'clear drawing'],
        ['s', 'screenshot'],
        ['t', 'GPU stage timings (console)'],
        ['f', 'fullscreen'],
        ['?', 'this help'],
      ];
      const help = $('help');
      KEYS.forEach(([k, d]) => help.append(el('div', { className: 'row' }, el('span', {}, ...k.split(' ').map((x) => el('kbd', { textContent: x }))), el('span', { textContent: d }))));
      const toggleHelp = (force) => {
        help.classList.toggle('open', force);
        $('help-btn').classList.toggle('on', help.classList.contains('open'));
      };
      $('help-btn').addEventListener('click', () => toggleHelp());

      // ── FPS + perf graph (js = rasterise + encode, gpu = submit to done) ──
      const fpsEl = $('fps'), perfGraph = $('perf-graph'), perfCanvas = $('perf-canvas'), perfCtx = perfCanvas.getContext('2d');
      const DPR = window.devicePixelRatio || 1;
      const GW = 340, GH = 130, ML = 30, PW = GW - ML, PH = GH;
      perfCanvas.width = GW * DPR;
      perfCanvas.height = GH * DPR;
      perfCanvas.style.width = GW + 'px';
      perfCanvas.style.height = GH + 'px';
      const cpuSamples = new Float32Array(PW), gpuSamples = new Float32Array(PW);
      let sampleIdx = 0, scaleMax = 20, avgCpu = 0, avgGpu = 0, avgFps = 0;
      fpsEl.addEventListener('click', () => {
        perfOpen = !perfOpen;
        perfGraph.classList.toggle('open', perfOpen);
        syncURL();
      });
      const TICKS = [2, 4, 8, 16, 32, 64, 128];
      function drawPerfGraph() {
        const ctx = perfCtx;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, GW, GH);
        let dataMax = 1;
        for (let i = 0; i < PW; i++) dataMax = Math.max(dataMax, cpuSamples[i] + gpuSamples[i]);
        const ceilTick = TICKS.find((t) => t >= dataMax) ?? TICKS[TICKS.length - 1];
        const target = Math.max(ceilTick * 1.1, 8);
        if (target > scaleMax) scaleMax = target;
        else scaleMax += (target - scaleMax) * 0.03;
        const sqrtMax = Math.sqrt(scaleMax);
        const toY = (ms) => PH - (Math.sqrt(Math.max(0, ms)) / sqrtMax) * PH;
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        ctx.fillRect(ML, 0, PW, PH);
        ctx.font = '9px monospace';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (const ms of TICKS) {
          if (ms > scaleMax * 0.98) continue;
          const y = toY(ms);
          if (y < 6 || y > PH - 4) continue;
          const budget = ms === 16 || ms === 32;
          ctx.strokeStyle = budget ? 'rgba(100,255,100,0.2)' : 'rgba(255,255,255,0.06)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(ML, y);
          ctx.lineTo(GW, y);
          ctx.stroke();
          ctx.fillStyle = budget ? 'rgba(100,255,100,0.5)' : 'rgba(255,255,255,0.25)';
          ctx.fillText(`${ms}`, ML - 3, y);
        }
        const line = (samples, color) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          for (let i = 0; i < PW; i++) {
            const y = Math.max(0, Math.min(PH, toY(samples[(sampleIdx + i) % PW])));
            i === 0 ? ctx.moveTo(ML + i, y) : ctx.lineTo(ML + i, y);
          }
          ctx.stroke();
        };
        line(cpuSamples, 'rgba(100,200,255,0.85)');
        line(gpuSamples, 'rgba(255,150,80,0.85)');
      }
      let lastFpsUpdate = 0, lastSolves = 0;
      (function tick(now) {
        avgCpu += (cpuMs - avgCpu) * 0.05;
        avgGpu += (gpuMs - avgGpu) * 0.05;
        cpuSamples[sampleIdx] = cpuMs;
        gpuSamples[sampleIdx] = gpuMs;
        sampleIdx = (sampleIdx + 1) % PW;
        if (now - lastFpsUpdate > 250) {
          const fps = ((solves - lastSolves) * 1000) / Math.max(1, now - lastFpsUpdate);
          avgFps += (fps - avgFps) * 0.5;
          lastSolves = solves;
          lastFpsUpdate = now;
          if (!benching) fpsEl.textContent = solveN === cfg.N ? `${solveN}² · ${frameMs.toFixed(1)} ms / frame` : `${cfg.N}² · move to time`;
        }
        if (perfOpen) {
          drawPerfGraph();
          $('perf-fps').textContent = `${Math.round(avgFps)} fps while changing`;
          $('perf-cpu-val').textContent = `js ${avgCpu.toFixed(1)}ms`;
          $('perf-gpu-val').textContent = `gpu ${avgGpu.toFixed(1)}ms`; // perf graph: running averages
        }
        requestAnimationFrame(tick);
      })(0);

      // ════════════════════════════════════════════════════════════════════
      // Keyboard
      // ════════════════════════════════════════════════════════════════════
      document.addEventListener('keydown', async (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const t = e.target;
        if (t instanceof HTMLInputElement && (t.type === 'text' || (t.type === 'range' && e.key.startsWith('Arrow')))) return;
        const d = e.code.match(/^Digit(\d)$/);
        if (d) {
          e.preventDefault();
          if (e.shiftKey) {
            switchScene(+d[1]);
            changed();
          } else if (+d[1] <= KINDS.length) ((pen.kind = KINDS[(+d[1] + KINDS.length - 1) % KINDS.length][0]), selectShape(null), touch());
          return;
        }
        let handled = true;
        switch (e.key) {
          case 'v': case 'V': out.view = out.view === 'scene' ? 'fluence' : 'scene'; redraw = true; changed(); break;
          case 'm': case 'M': out.tint = !out.tint; redraw = true; changed(); break;
          case 'b': case 'B': out.map = out.map === 'banded' ? 'tone' : 'banded'; redraw = true; changed(); break;
          case '?': toggleHelp(); break;
          case 'Escape': toggleHelp(false); selectShape(null); break;
          case '=': case '+': stepPenSize(1); break;
          case '-': case '_': stepPenSize(-1); break;
          case 'c': case 'C': strokes = []; touch(); break;
          case 's': case 'S': screenshot(); break;
          case 'f': case 'F':
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
            break;
          case 't': case 'T': {
            const r = await engine().profile(10);
            console.table(Object.entries(r).map(([stage, ms]) => ({ stage, ms: ms.toFixed(3) })));
            console.log(`one frustum: ${Object.values(r).reduce((a, b) => a + b, 0).toFixed(2)} ms (×4 for a frame)`);
            break;
          }
          case 'ArrowRight': switchScene(currentScene + 1); changed(); break;
          case 'ArrowLeft': switchScene(currentScene - 1); changed(); break;
          case 'n': case 'N':
            shapes.push({ x: -30, y: -30, w: 60, h: 60, ...(pen.kind === 'eraser' ? { rgb: [0, 0, 0], opacity: 1 } : penMaterial()) });
            selectShape(shapes.at(-1));
            touch();
            break;
          case 'Delete':
          case 'Backspace':
            if (selected) {
              shapes = shapes.filter((s) => s !== selected);
              selectShape(null);
              touch();
            }
            break;
          default:
            handled = false;
        }
        if (handled) {
          e.preventDefault();
          if (t !== document.body) t?.blur?.();
        }
      });

      // ════════════════════════════════════════════════════════════════════
      // Pointer: drag a shape (topmost under the pointer), or draw / erase strokes; the cursor is a pen-material light
      // ════════════════════════════════════════════════════════════════════
      const toScene = (e) => {
        const r = squareRect();
        return [((e.clientX - r.left) / r.width - 0.5) * SPAN, ((e.clientY - r.top) / r.height - 0.5) * SPAN];
      };
      const cellUnits = () => SPAN / cfg.N;
      const shapeAt = ([u, v]) => {
        const pad = cellUnits() / 2; // shapes thinner than a cell still pick
        for (let i = shapes.length - 1; i >= 0; i--) {
          const s = shapes[i];
          if (u >= s.x - pad && u <= s.x + s.w + pad && v >= s.y - pad && v <= s.y + s.h + pad) return s;
        }
        return null;
      };
      let drawing = false, drag = null, last = null;
      view.addEventListener('pointerdown', (e) => {
        const p = toScene(e);
        view.setPointerCapture(e.pointerId);
        const s = shapeAt(p);
        if (s && pen.kind !== 'eraser') {
          selectShape(s);
          drag = { s, dx: s.x - p[0], dy: s.y - p[1] };
          view.className = 'grabbing';
        } else {
          selectShape(null);
          drawing = true;
          last = p;
          paint(p, p);
        }
        e.preventDefault();
      });
      function paint(a, b) {
        if (pen.kind === 'eraser') {
          const r = Math.max(pen.size, 2) * cellUnits();
          const near = (s) => {
            const vx = s.x1 - s.x0, vy = s.y1 - s.y0, L = vx * vx + vy * vy;
            const t = L > 0 ? Math.max(0, Math.min(1, ((b[0] - s.x0) * vx + (b[1] - s.y0) * vy) / L)) : 0;
            return Math.hypot(s.x0 + t * vx - b[0], s.y0 + t * vy - b[1]) < r;
          };
          strokes = strokes.filter((s) => !near(s));
        } else strokes.push({ x0: a[0], y0: a[1], x1: b[0], y1: b[1], size: pen.size * cellUnits(), ...penMaterial() });
        touch();
      }
      view.addEventListener('pointermove', (e) => {
        const p = toScene(e);
        cursor = p;
        if (drag) Object.assign(drag.s, { x: p[0] + drag.dx, y: p[1] + drag.dy });
        else if (drawing && Math.hypot(p[0] - last[0], p[1] - last[1]) >= cellUnits()) {
          paint(last, p);
          last = p;
        } else if (!drawing) view.className = shapeAt(p) && pen.kind !== 'eraser' ? 'grab' : '';
        touch();
      });
      const end = () => {
        drawing = false;
        drag = null;
        view.className = '';
        touch();
      };
      view.addEventListener('pointerup', end);
      view.addEventListener('pointercancel', end);
      view.addEventListener('pointerleave', () => {
        cursor = null;
        touch();
      });

      // debugging / headless hooks
      window.momentHRC = { cfg, out, device, engine, touch, bench, stats: () => ({ cpuMs, gpuMs, solves, frameMs }), scene: () => ({ shapes, strokes, E, A }) };

      // ── Init ──
      const initScene = loadURL();
      urlReady = true;
      perfGraph.classList.toggle('open', perfOpen);
      syncPen();
      refresh();
      layout();
      switchScene(initScene);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
