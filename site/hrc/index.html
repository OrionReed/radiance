<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRC</title>
    <meta name="description" content="HRC as in the paper, with volumetrics, bounces and an exact reference; the baseline the other schemes are compared against" />
    <meta name="order" content="1" />
    <link rel="stylesheet" href="../_shared/page.css" />
    <style>
      #hrc {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      /* the scene square: the pen draws on it and drags shapes */
      #hrc canvas {
        pointer-events: auto !important;   /* over hrc.ts's inline none */
        touch-action: none;
        cursor: crosshair;
      }
      #hrc canvas.grab {
        cursor: grab;
      }
      #hrc canvas.grabbing {
        cursor: grabbing;
      }
      /* ── Panels ── */
      #right {
        border-left: 1px solid var(--line);
      }
      /* pen */
      #swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        align-items: center;
      }
      .chip {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        cursor: pointer;
        padding: 0;
      }
      .chip:hover {
        border-color: rgba(255, 255, 255, 0.45);
      }
      .chip.on {
        border-color: #fff;
      }
      .chip.eraser {
        background: repeating-conic-gradient(#555 0% 25%, #888 0% 50%) 50% / 8px 8px;
      }
      #custom-color {
        width: 18px;
        height: 16px;
        border: none;
        padding: 0;
        cursor: pointer;
        background: none;
      }
      #custom-color::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      #custom-color::-webkit-color-swatch {
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      /* status / tools */
      #fps {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        margin-right: auto;
      }
      /* the scene locks while a reference is shown: the shapes and the panels below the scene list are frozen */
      body.locked #left section:not(#tools):not(:first-child) {
        opacity: 0.4;
        pointer-events: none;
      }
      body.locked #hrc canvas {
        outline: 2px solid var(--lock);
        outline-offset: 3px;
      }
      .progress {
        height: 3px;
        border-radius: 2px;
        background: var(--ctl);
        overflow: hidden;
      }
      .progress > div {
        height: 100%;
        width: 0;
        background: var(--accent);
      }
      /* the GPU profile */
      .gpu-profiler {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <aside id="left">
      <section>
        <h2>scene <small id="scene-id"></small></h2>
        <div id="scene-list"></div>
      </section>
      <section>
        <div id="scene-params"></div>
      </section>
      <section id="pen">
        <h2><span id="pen-title">pen</span> <small id="pen-sub"></small></h2>
        <div id="swatches"><input type="color" id="custom-color" value="#cccccc" title="custom colour" /></div>
        <div class="field" style="margin-top: 10px">
          <div class="label"><span>opacity</span><span class="val" id="v-opacity"></span></div>
          <input id="p-opacity" type="range" min="0" max="1" step="0.01" />
        </div>
        <div class="field">
          <div class="label"><span>albedo</span><span class="val" id="v-albedo"></span></div>
          <input id="p-albedo" type="range" min="0" max="1" step="0.01" />
        </div>
        <div id="size-field"></div>
      </section>
    </aside>

    <div id="canvas-area">
      <div id="hrc"></div>
      <div id="help"></div>
    </div>

    <aside id="right">
      <section>
        <h2>features</h2>
        <div id="features"></div>
      </section>
      <section>
        <h2>output</h2>
        <div id="output"></div>
        <div id="legend"></div>
      </section>
      <section id="tools">
        <span id="fps" title="GPU profile" style="cursor: pointer"></span>
        <input id="scene-file" type="file" accept=".png" style="display: none" />
        <button id="load-btn" title="load a square scene PNG">load</button>
        <button id="save-btn" title="save the scene as PNG">save</button>
        <button id="shot-btn" title="screenshot (s)">shot</button>
        <button id="help-btn" title="keyboard shortcuts (?)">?</button>
      </section>
    </aside>

    <script type="module">
      import { HRC, SCENE_SPAN } from './hrc';
      import { EXPOSURE, EXPOSURE_CONTROL, BANDED_LEGEND, MAP_CONTROL, MAP_INDEX } from '../_shared/display';
      import { scenesFor, REFERENCE_CELLS } from '../_shared/scenes';
      import { $, el, createControls, writeControls, readControls, sceneFromURL, replaceURL } from '../_shared/ui';
      import { penPointer, PEN_SIZES, nextPenSize } from '../_shared/scene-panel';

      const hrc = new HRC($('hrc'), { pixelPerfect: 256, probeCount: 256, exposure: 1 });

      // ════════════════════════════════════════════════════════════════════
      // Controls: a toggle is an independent on/off; a segmented control picks one of several.
      // Each spec: { label, get(), set(v), enabled?(), key?, title?, url?: [name, default] }.
      // refresh() re-reads every control from the element, so keyboard shortcuts and URL loads stay in sync.
      // ════════════════════════════════════════════════════════════════════
      const { controls, toggle, segmented, slider, syncControls } = createControls(() => changed());
      const prop = (name) => ({ get: () => hrc[name], set: (v) => (hrc[name] = v) });
      function refresh() {
        syncControls();
        renderLegend();
      }
      function changed() {
        refresh();
        syncURL();
      }

      // ════════════════════════════════════════════════════════════════════
      // Scenes: scene(group, name, build), build(ctx) with ctx.add(x, y, w, h, colour, opts), ctx.shapes([...]) and
      // ctx.move(shape, x, y). Scene units: origin at the square's centre, 1024 across (1 unit = 1 probe at N = 1024).
      // ════════════════════════════════════════════════════════════════════
      const presets = [
        { name: 'Eraser', css: null, rgb: [0, 0, 0] },
        { name: 'Black', css: '#000', rgb: [0, 0, 0] },
        { name: 'Red', css: '#ff4444', rgb: [1, 0.25, 0.25] },
        { name: 'Orange', css: '#ff8833', rgb: [1, 0.5, 0.2] },
        { name: 'Yellow', css: '#dddd33', rgb: [0.75, 0.75, 0.2] },
        { name: 'Green', css: '#44dd55', rgb: [0.25, 0.8, 0.35] },
        { name: 'Cyan', css: '#44dddd', rgb: [0.25, 0.75, 0.75] },
        { name: 'Blue', css: '#4466ff', rgb: [0.3, 0.4, 1] },
        { name: 'Purple', css: '#aa44ff', rgb: [0.65, 0.3, 1] },
        { name: 'White', css: '#ffffff', rgb: [0.8, 0.8, 0.8] },
      ];

      /** The displayed square in viewport pixels. */
      function squareRect() {
        const c = hrc.canvas;
        if (c && c.style.width) return c.getBoundingClientRect();
        const r = hrc.host.getBoundingClientRect(); // before WebGPU init: the renderer's own layout rule
        const d = Math.min(r.width - 64, r.height - 64);
        return { left: r.left + (r.width - d) / 2, top: r.top + (r.height - d) / 2, width: d, height: d };
      }

      const scenes = [];
      const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      function scene(group, name, build, N) {
        scenes.push({ id: slug(name), group, name, build, N });
      }

      function sceneContext() {
        const move = (shape, x, y) => Object.assign(shape, { x, y });
        const add = (x, y, width, height, colour, opts) => {
          const s = { x, y, width, height, rgb: colour !== undefined ? [...(presets[colour]?.rgb ?? [0, 0, 0])] : [0, 0, 0] };
          if (opts?.opacity !== undefined) s.opacity = opts.opacity;
          if (opts?.albedo !== undefined) s.albedo = opts.albedo;
          if (opts?.color) s.rgb = [...opts.color];
          hrc.shapes.push(s);
          return s;
        };
        const shapes = (list) => list.map(([x, y, w, h, c, o]) => add(x, y, w, h, c, o));
        return { add, shapes, move };
      }

      // The shared scenes (site/_shared/scenes.ts) come first: a light's linear colour (or grey brightness) becomes the sRGB
      // colour this page decodes, and opacity per reference cell becomes opacity per pixel at the current N. Tests impose
      // their N while they are shown.
      const toSRGB = (v) => (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
      for (const s of scenesFor({ volumes: true })) {
        scene(s.group, s.name, () => {
          const n = hrc.pixelPerfect;
          for (const sh of s.shapes) {
            const rgb = (sh.color ?? [sh.brightness, sh.brightness, sh.brightness]).map(toSRGB);
            hrc.shapes.push({ x: sh.x, y: sh.y, width: sh.w, height: sh.h, rgb, opacity: sh.opacity >= 1 ? 1 : 1 - (1 - sh.opacity) ** (REFERENCE_CELLS / n) });
          }
        }, s.N);
      }

      // ── Scenes with see-through lights, coloured media and bounces ──
      // shapes are [x, y, w, h, colourIndex, opts?] (top-left, scene units)
      const V0 = { opacity: 0 }; // volumetric light: the ratio's light model
      const PINHOLE = [
        [-200, -84, 16, 24, 2], [-200, -60, 16, 24, 3], [-200, -36, 16, 24, 4], [-200, -12, 16, 24, 5],
        [-200, 12, 16, 24, 6], [-200, 36, 16, 24, 7], [-200, 60, 16, 24, 8],
        [-5, -500, 8, 488, 1], [-5, 12, 8, 500, 1],
      ];
      const staticScene = (group, name, list) => scene(group, name, (c) => c.shapes(list));

      staticScene('HRC only', 'Vol pinhole', PINHOLE.map((s) => (s[4] === 1 ? s : [...s.slice(0, 5), V0])));

      staticScene('HRC only', 'Stained glass', [
        [-10, -120, 20, 30, 1], [-10, -90, 20, 40, 2, { opacity: 0.6 }], [-10, -50, 20, 40, 5, { opacity: 0.6 }],
        [-10, -10, 20, 40, 7, { opacity: 0.6 }], [-10, 30, 20, 40, 4, { opacity: 0.6 }], [-10, 70, 20, 30, 1],
      ]);
      staticScene('HRC only', 'Materials', [
        [-245, -20, 50, 50, 3], [-175, -20, 50, 50, 1], [-105, -20, 50, 50, 2, { opacity: 0.6 }],
        [-35, -20, 50, 50, 0, { opacity: 0.05, albedo: 0.8 }], [35, -20, 50, 50, 0, { albedo: 0.8 }],
        [105, -20, 50, 50, 0, { opacity: 0.3 }], [175, -20, 50, 50, 5, { opacity: 0.03, albedo: 0.5 }],
        [245, -20, 50, 50, 5, { opacity: 0.6 }], [-30, -150, 60, 15, 9],
      ]);

      staticScene('HRC only', 'Scattering', [
        [-250, -20, 30, 40, 9], [-150, -150, 250, 300, 0, { opacity: 0.03, albedo: 1 }],
        [-10, -60, 20, 120, 1], [150, -100, 150, 200, 0, { opacity: 0.03 }], [350, -20, 30, 40, 9],
      ]);

      staticScene('bounces', 'Bounce room', [
        [-250, -200, 500, 15, 0, { albedo: 0.7 }], [-250, 185, 500, 15, 0, { albedo: 0.7 }],
        [-250, -200, 15, 400, 0, { albedo: 0.7 }], [235, -200, 15, 400, 0, { albedo: 0.7 }],
        [-40, -190, 80, 10, 9], [-30, -30, 60, 60, 1], [-248, 50, 10, 20, 2],
      ]);
      staticScene('bounces', 'Bounce maze', [
        [-310, -200, 300, 20, 0, { albedo: 0.9 }], [-310, 180, 300, 20, 0, { albedo: 0.9 }],
        [-310, -200, 20, 400, 0, { albedo: 0.9 }], [-20, -200, 20, 400, 0, { albedo: 0.9 }],
        [-200, -70, 20, 270, 0, { albedo: 0.9 }], [-110, -180, 20, 200, 0, { albedo: 0.9 }], [-300, -190, 20, 20, 9],
        [10, -200, 300, 20, 0, { albedo: 0.3 }], [10, 180, 300, 20, 0, { albedo: 0.3 }],
        [10, -200, 20, 400, 0, { albedo: 0.3 }], [290, -200, 20, 400, 0, { albedo: 0.3 }],
        [120, -70, 20, 270, 0, { albedo: 0.3 }], [210, -180, 20, 200, 0, { albedo: 0.3 }], [20, -190, 20, 20, 9],
      ]);
      scene('bounces', 'Furnace test', (c) => {
        const r = 120, t = 20;
        for (let i = 0; i < 32; i++) {
          const a0 = (i / 32) * Math.PI * 2, a1 = ((i + 1) / 32) * Math.PI * 2;
          const x0 = Math.cos(a0) * r, y0 = Math.sin(a0) * r, x1 = Math.cos(a1) * r, y1 = Math.sin(a1) * r;
          c.add(Math.min(x0, x1) - t / 2, Math.min(y0, y1) - t / 2, Math.max(Math.abs(x1 - x0) + t, t), Math.max(Math.abs(y1 - y0) + t, t), 3);
        }
      });

      // ── Scene switching ──
      let currentScene = 0, freeN = null;   // freeN: the resolution to go back to after a test
      const sceneButtons = [];
      function switchScene(index) {
        currentScene = (index + scenes.length) % scenes.length;
        const N = scenes[currentScene].N;
        if (N) ((freeN ??= hrc.pixelPerfect), setProbes(N));
        else if (freeN) (setProbes(freeN), (freeN = null));
        document.activeElement?.blur();
        selectShape(null);
        hrc.clearLines();
        hrc.shapes.length = 0;
        scenes[currentScene].build(sceneContext());
        sceneButtons.forEach((b, i) => b.classList.toggle('on', i === currentScene));
        $('scene-id').textContent = scenes[currentScene].id;
        if (locked) startExact();
        syncURL();
      }
      {
        const list = $('scene-list');
        let group = null;
        scenes.forEach((s, i) => {
          if (s.group !== group) list.append(el('div', { className: 'group', textContent: (group = s.group) }));
          const b = el('button', { title: s.id }, el('span', { className: 'idx', textContent: i }), el('span', { textContent: s.name }));
          b.addEventListener('click', () => {
            switchScene(i);
            changed();
          });
          list.append(b);
          sceneButtons.push(b);
        });
      }

      // ════════════════════════════════════════════════════════════════════
      // Sky
      // ════════════════════════════════════════════════════════════════════
      function buildSky(fn) {
        const PI = Math.PI, N = 256, data = new Float32Array(N * 4);
        const wrap = (d) => (d > PI ? d - PI * 2 : d < -PI ? d + PI * 2 : d);
        const add = (i, c, k) => {
          data[i * 4] += c[0] * k;
          data[i * 4 + 1] += c[1] * k;
          data[i * 4 + 2] += c[2] * k;
        };
        const angle = (i) => (i / N) * PI * 2 - PI;
        const spot = (a0, sigma, color) => {
          for (let i = 0; i < N; i++) add(i, color, Math.exp(-(wrap(angle(i) - a0) ** 2) / (2 * sigma * sigma)));
        };
        const fill = (color) => {
          for (let i = 0; i < N; i++) add(i, color, 1);
        };
        const hueRing = (intensity, s = 1, offset = 0) => {
          for (let i = 0; i < N; i++) {
            const h = (i / N + offset) % 1;
            const k = (n) => (n + h * 6) % 6;
            const f = (n) => intensity * (1 - s * Math.max(0, Math.min(k(n), 4 - k(n), 1)));
            add(i, [f(0), f(4), f(2)], 1);
          }
        };
        fn({ spot, fill, hueRing, PI, N, data });
        for (let i = 0; i < N; i++) data[i * 4 + 3] = 1;
        hrc.setSkyCircle(data);
      }
      const skies = {
        none: () => hrc.clearSky(),
        overcast: () => hrc.setSkyColor(0.04, 0.045, 0.05),
        spectrum: () => buildSky(({ hueRing }) => hueRing(1.5, 1, 0)),
        iridescent: () =>
          buildSky(({ PI, N, data }) => {
            for (let i = 0; i < N; i++) {
              const t = i / N, phase = t * PI * 3, br = 0.6 + 0.4 * Math.cos(t * PI * 2);
              data[i * 4] = (0.5 + 0.5 * Math.cos(phase)) * br;
              data[i * 4 + 1] = (0.5 + 0.5 * Math.cos(phase + PI * 0.7)) * br;
              data[i * 4 + 2] = (0.5 + 0.5 * Math.cos(phase + PI * 1.4)) * br;
            }
          }),
        studio: () =>
          buildSky(({ spot, PI }) => {
            spot(-PI * 0.65, 0.08, [2.2, 2.4, 2.8]);
            spot(-PI * 0.35, 0.1, [2.5, 2.2, 1.8]);
            spot(PI * 0.8, 0.12, [2.0, 2.0, 2.3]);
          }),
        rgb: () =>
          buildSky(({ spot, PI }) => {
            const s = (PI * 2) / 3;
            spot(-PI / 2, 0.04, [4, 0.05, 0.05]);
            spot(-PI / 2 + s, 0.04, [0.05, 4, 0.05]);
            spot(-PI / 2 + s * 2, 0.04, [0.05, 0.05, 4]);
          }),
        sunset: () =>
          buildSky(({ spot, PI, N, data }) => {
            spot(-PI / 8, 0.09, [1.8, 0.5, 0.15]);
            for (let i = 0; i < N; i++) {
              const vert = Math.sin((i / N) * PI * 2 - PI) * 0.5 + 0.5;
              data[i * 4] += 0.08 * (1 - vert);
              data[i * 4 + 1] += 0.03 * (1 - vert);
              data[i * 4 + 2] += 0.06 * vert;
            }
          }),
        moonlight: () =>
          buildSky(({ spot, fill, PI }) => {
            spot(-PI / 3, 0.04, [0.4, 0.5, 0.7]);
            fill([0.002, 0.003, 0.006]);
          }),
      };
      let sky = 'none';
      const setSky = (name) => {
        sky = skies[name] ? name : 'none';
        skies[sky]();
      };

      // ════════════════════════════════════════════════════════════════════
      // Pen / shape inspector
      // ════════════════════════════════════════════════════════════════════
      // exact sRGB transfer (matches the element's shaders)
      const srgbToLin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
      const linToSrgb = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
      const toHex = (rgb) =>
        '#' + rgb.map((c) => Math.round(linToSrgb(Math.max(0, Math.min(1, c))) * 255).toString(16).padStart(2, '0')).join('');
      const fromHex = (h) => [h.slice(1, 3), h.slice(3, 5), h.slice(5, 7)].map((s) => srgbToLin(parseInt(s, 16) / 255));
      const pen = { color: [0.8, 0.8, 0.8], opacity: 1, albedo: 0, size: 8, eraser: false };
      let selectedShape = null;
      const customColor = $('custom-color');
      const sOpacity = $('p-opacity'), sAlbedo = $('p-albedo');
      const chips = presets.map((p, i) => {
        const b = el('button', { className: 'chip' + (i === 0 ? ' eraser' : ''), title: `${p.name} (${i})` });
        if (p.css) b.style.backgroundColor = p.css;
        b.addEventListener('click', () => pickPreset(i));
        $('swatches').insertBefore(b, customColor);
        return b;
      });
      const f3 = (v) => (v < 0.1 ? v.toFixed(3) : v.toFixed(2));

      function pickPreset(idx) {
        pen.eraser = idx === 0;
        if (idx > 0) pen.color = [...presets[idx].rgb];
        if (selectedShape && idx > 0) selectedShape.rgb = [...pen.color];
        syncPen();
        syncMouse();
      }
      customColor.addEventListener('input', () => {
        pen.color = fromHex(customColor.value);
        pen.eraser = false;
        if (selectedShape) selectedShape.rgb = [...pen.color];
        syncPen();
        syncMouse();
      });
      sOpacity.addEventListener('input', () => {
        const opacity = Number(sOpacity.value) ** 3;
        if (selectedShape) selectedShape.opacity = opacity;
        else {
          pen.opacity = opacity;
          syncMouse();
        }
        syncPen();
      });
      sAlbedo.addEventListener('input', () => {
        const v = Number(sAlbedo.value);
        if (selectedShape) selectedShape.albedo = v;
        else {
          pen.albedo = v;
          syncMouse();
        }
        syncPen();
      });
      function setPenSize(v) {
        pen.size = v;
        hrc.setMouseLightRadius(pen.size / 2);
        syncPen();
        refresh();
      }
      const stepPenSize = (d) => setPenSize(nextPenSize(pen.size, d, 8));

      function syncPen() {
        const shape = selectedShape;
        $('pen-title').textContent = shape ? 'shape' : 'pen';
        $('pen-sub').textContent = shape ? 'selected · ⌫ deletes' : '';
        $('size-field').style.display = shape ? 'none' : '';
        let color, opacity, albedo;
        if (shape) {
          color = shape.rgb ?? [0, 0, 0];
          opacity = shape.opacity ?? 1;
          albedo = shape.albedo ?? 0;
        } else ({ color, opacity, albedo } = pen);
        customColor.value = toHex(color);
        sOpacity.value = Math.cbrt(opacity);
        $('v-opacity').textContent = f3(opacity);
        sAlbedo.value = albedo;
        $('v-albedo').textContent = albedo.toFixed(2);
        chips.forEach((c, i) => c.classList.toggle('on', i === 0 ? pen.eraser : !pen.eraser && !shape && presets[i].rgb.join() === pen.color.join()));
      }
      function syncMouse() {
        const off = pen.eraser || locked;
        const [r, g, b] = off ? [0, 0, 0] : pen.color;
        hrc.setMouseLightColor(r, g, b);
        hrc.setMouseLightMaterial(off ? 0 : pen.opacity, off ? 0 : pen.albedo);
      }
      function selectShape(shape) {
        selectedShape = shape;
        syncPen();
      }

      // ════════════════════════════════════════════════════════════════════
      // Panels
      // ════════════════════════════════════════════════════════════════════
      // probes: the square is always pixel-perfect (one probe per canvas pixel)
      const PROBES = [64, 128, 256, 512, 1024, 2048];
      function setProbes(n) {
        hrc.probeCount = n;
        hrc.pixelPerfect = n;
      }
      segmented($('scene-params'), { label: 'probes', title: 'tests set their own', options: PROBES.map((n) => [n, String(n)]), get: () => hrc.pixelPerfect, set: setProbes, enabled: () => !scenes[currentScene].N, url: ['probes', 256] });
      segmented($('scene-params'), {
        label: 'sky',
        cols: 4,
        options: [['none', 'none'], ['overcast', 'overc.', 'overcast'], ['spectrum', 'spectr.', 'spectrum'], ['iridescent', 'irid.', 'iridescent'], ['studio', 'studio'], ['rgb', 'RGB'], ['sunset', 'sunset'], ['moonlight', 'moon', 'moonlight']],
        get: () => sky,
        set: setSky,
      });

      segmented($('size-field'), { label: 'size (px)', options: PEN_SIZES.map((n) => [n, String(n)]), get: () => pen.size, set: setPenSize });

      const F = $('features');
      toggle(F, { label: 'bounces', ...prop('bounces'), url: ['bounces', false] });
      toggle(F, {
        label: 'ratio',
        key: 'r',
        title: 'exact free-space transport × cascade visibility',
        get: () => hrc.ratio,
        set: (v) => {
          hrc.ratio = v;
          if (locked) requestAnimationFrame(() => requestAnimationFrame(startExact)); // the reference sees the ratio's transport world
        },
        url: ['ratio', false],
      });
      toggle(F, { label: 'shifted read', key: 'p', title: 'the merge reads each ray kappa/2 rows toward the nearest odd ray (parityRead)', ...prop('parityRead'), url: ['parity', false] });
      toggle(F, { label: 'equal footprints', key: 'e', title: 'even rays blurred across slices to match the odd rays, quadrant edges drained (equalise)', ...prop('equalise'), url: ['equal', false] });
      toggle(F, {
        label: 'length correction',
        title: "odd rays take the straight ray's length, removing their brightening of volumetrics (lengthCorrection)",
        ...prop('lengthCorrection'),
        url: ['length', false],
      });
      segmented(F, {
        label: 'free field',
        title: "the ratio's free field: FFT convolution, or a direct sum over emitters as a check",
        options: [['fft', 'FFT'], ['direct', 'direct']],
        ...prop('freeMethod'),
        enabled: () => hrc.ratio,
        url: ['free', 'fft'],
      });
      segmented(F, {
        label: 'colour resolution',
        title: 'colour cascade resolution relative to the probes; luminance stays full',
        options: [[1, 'full'], [0.5, '½'], [0.25, '¼'], [0.125, '⅛']],
        ...prop('colorScale'),
        enabled: () => !hrc.ratio,
        url: ['color', 1],
      });
      // memory and pass savings on the default cascade
      toggle(F, {
        label: 'lean storage',
        title: 'only odd levels keep their rays, the rest are rebuilt in registers: about half the bytes, output within f16 rounding (lean)',
        ...prop('lean'),
        enabled: () => !hrc.ratio && !hrc.parityRead && !hrc.equalise,
        url: ['lean', false],
      });
      toggle(F, {
        label: 'exact rounding',
        title: 'rebuilt rays are rounded through f16 as if stored, so the output equals the default (leanExact)',
        ...prop('leanExact'),
        enabled: () => hrc.lean,
        url: ['leanexact', false],
      });
      toggle(F, {
        label: 'one compute pass',
        title: "all of a frame's cascade dispatches in one compute pass instead of twelve; same output (singlePass)",
        ...prop('singlePass'),
        url: ['onepass', false],
      });

      // the display map (shared display.ts): tone map or log₂; the exposure in stops from E = 1
      const mapGet = () => (hrc.map ? 'banded' : 'tone');
      const mapSet = (m) => (hrc.map = MAP_INDEX[m]);
      let stops = 0;
      const O = $('output');
      segmented(O, {
        label: 'reference',
        title: "a reference of the same scene, or HRC's error against it; the scene locks while one is shown",
        cols: 2,
        options: [[1, 'path trace'], [3, 'exact'], [2, 'Δ path trace', 'error against the path trace'], [4, 'Δ exact', 'error against the exact reference']],
        get: () => hrc.debugMode,
        set: (v) => ((hrc.debugMode = hrc.debugMode === v ? 0 : v), setLocked(hrc.debugMode !== 0)),
        url: ['debug', 0],
      });
      O.lastElementChild.classList.add('reference');
      const refStatus = el('div', { className: 'hint', id: 'ref-status' });
      const refBar = el('div', { className: 'progress' }, el('div'));
      O.append(el('div', { className: 'field' }, refBar, refStatus));
      segmented(O, {
        label: 'view',
        title: 'what the ratio pipeline writes to the fluence (ratioView)',
        cols: 3,
        options: [[0, 'result'], [1, 'free field'], [2, 'visibility'], [3, 'HRC alone'], [4, 'casc. free', 'cascade free estimate']],
        ...prop('ratioView'),
        enabled: () => hrc.ratio,
        url: ['rview', 0],
      });
      segmented(O, { ...MAP_CONTROL, get: mapGet, set: mapSet, url: ['map', 'tone'] });
      slider(O, { ...EXPOSURE_CONTROL, get: () => stops, set: (v) => ((stops = v), (hrc.exposure = EXPOSURE * 2 ** v)), format: (v) => (v > 0 ? `+${v}` : String(v)), url: ['stops', 0] });

      // ── Scene lock + exact reference ──
      let locked = false, errorClip = 0;   // errorClip: the error legend's clip, an exponent (0: off)
      const exactDensity = 32;   // the exact reference's directions per pixel, per pixel of N (the scheme pages' EXACT_DENSITY)
      function startExact() {
        hrc.ready   // a reference picked from the URL arrives before the renderer is ready
          .then(() => hrc.exactEnsure({ m: exactDensity * hrc.pixelPerfect }))
          .catch((err) => console.error(err));
      }
      function setLocked(v) {
        locked = v;
        document.body.classList.toggle('locked', locked);
        syncMouse();
        if (locked) {
          document.activeElement?.blur?.();
          selectShape(null);
          startExact();
        } else hrc.exactPause();
      }
      const fmtTime = (ms) => (!isFinite(ms) ? '…' : ms < 60e3 ? `${(ms / 1000).toFixed(ms < 10e3 ? 1 : 0)} s` : `${Math.floor(ms / 60e3)} m ${Math.round((ms % 60e3) / 1000)} s`);
      function renderRefStatus() {
        const st = hrc.exactState;
        const bar = refBar.firstChild;
        if (!locked || !st) {
          bar.style.width = '0%';
          refStatus.textContent = locked ? 'snapshotting…' : 'picking a reference computes the exact one';
          return;
        }
        bar.style.width = `${(st.fraction * 100).toFixed(1)}%`;
        refStatus.textContent = st.done
          ? `exact reference ready (no bounces) · ${st.m} directions per pixel · took ${fmtTime(st.elapsedMs)}`
          : `${(st.fraction * 100).toFixed(1)} % · expected ${fmtTime(st.totalMs)} total · ${fmtTime(st.etaMs)} left`;
      }

      // ── Legends ──
      // the error legend: the blit shader's error colours, −1 through 0 (at most 1e-5) to +1. Dragging the bar sets errorClip,
      // the same on both sides of 0: errors of at least 10^errorClip show magenta (at the ends, 0, nothing does)
      const sup = (s) => String(s).replace(/[-.0-9]/g, (c) => ({ '-': '⁻', '.': '·' })[c] ?? '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]);
      function errorLegend(L, scheme, onClip) {
        const BRIGHTER = [[1, 1, 1], [0.957, 0.647, 0.51], [0.839, 0.376, 0.302], [0.404, 0, 0.122]];
        const DARKER = [[1, 1, 1], [0.573, 0.773, 0.871], [0.263, 0.576, 0.765], [0.02, 0.188, 0.38]];
        const colour = (t) => {   // t in [0, 1]: −1 at 0, 0 at ½, +1 at 1
          const d = Math.abs(2 * t - 1);
          if (errorClip < 0 && d >= (errorClip + 5) / 5) return 'rgb(217,51,199)';
          const s = t < 0.5 ? DARKER : BRIGHTER, m = (Math.round(d * 50) / 50) * 3, i = Math.min(Math.floor(m), 2), f = m - i;
          return `rgb(${s[i].map((a, k) => Math.round((a + (s[i + 1][k] - a) * f) * 255)).join(',')})`;
        };
        const b = el('div', { className: 'bar error', title: 'drag to mark errors of at least a size in magenta; double-click to clear' });
        const marks = [el('i'), el('i')];
        b.append(...marks);
        const ticks = el('div', { className: 'ticks' });
        Object.assign(ticks.style, { position: 'relative', height: '12px' });
        for (const [x, label] of [[0, '−1'], [20, '−10⁻²'], [40, '−10⁻⁴'], [50, '0'], [60, '10⁻⁴'], [80, '10⁻²'], [100, '1']]) {
          const s = el('span', { textContent: label });
          Object.assign(s.style, { position: 'absolute', left: `${x}%`, transform: `translateX(${x === 0 ? '0' : x === 100 ? '-100%' : '-50%'})` });
          ticks.append(s);
        }
        const caption = el('div', { className: 'caption' });
        const draw = () => {
          b.style.background = `linear-gradient(to right, ${Array.from({ length: 201 }, (_, k) => `${colour(k / 200)} ${k / 2}%`).join(',')})`;
          const d = (errorClip + 5) / 5;
          marks[0].style.left = `${50 - 50 * d}%`;
          marks[1].style.left = `${50 + 50 * d}%`;
          caption.textContent = `error: (${scheme} − reference) / reference (reference floored at 0.01), log scale, 10 bands per decade; white at 10⁻⁵ or less, red brighter, blue darker` +
            (errorClip < 0 ? `; magenta at least 10${sup(errorClip)}` : '');
        };
        const set = (e) => {
          const r = b.getBoundingClientRect(), d = Math.min(1, Math.abs((2 * (e.clientX - r.left)) / r.width - 1));
          errorClip = Math.min(0, Math.round((5 * d - 5) * 10) / 10);
          draw();
          onClip();
        };
        b.addEventListener('pointerdown', (e) => (b.setPointerCapture(e.pointerId), set(e)));
        b.addEventListener('pointermove', (e) => b.hasPointerCapture(e.pointerId) && set(e));
        b.addEventListener('dblclick', () => ((errorClip = 0), draw(), onClip()));
        draw();
        L.append(b, ticks, caption);
      }
      function renderLegend() {
        const L = $('legend');
        if (hrc.debugMode === 2 || hrc.debugMode === 4) {
          L.innerHTML = '';
          return errorLegend(L, 'HRC', () => (hrc.errorClip = errorClip < 0 ? 10 ** errorClip : 1e9));
        }
        L.innerHTML = '';
        if (mapGet() !== 'banded') return;
        const b = el('div', { className: 'bar' });
        b.style.background = BANDED_LEGEND.background;
        const ticks = el('div', { className: 'ticks' });
        Object.assign(ticks.style, { position: 'relative', height: '12px' });
        for (const [t, x] of BANDED_LEGEND.ticks) {
          const s = el('span', { textContent: t });
          Object.assign(s.style, { position: 'absolute', left: `${x}%`, transform: `translateX(${x === 0 ? '0' : x === 100 ? '-100%' : '-50%'})` });
          ticks.append(s);
        }
        L.append(b, ticks, el('div', { className: 'caption', textContent: BANDED_LEGEND.caption }));
      }

      // ════════════════════════════════════════════════════════════════════
      // URL state: every control with url: [name, default] round-trips; plus scene, sky, perf.
      // ════════════════════════════════════════════════════════════════════
      let perfOpen = false;
      let urlReady = false;
      function syncURL() {
        if (!urlReady) return;
        const p = new URLSearchParams();
        if (currentScene !== 0) p.set('scene', scenes[currentScene].id);
        if (sky !== 'none') p.set('sky', sky);
        writeControls(p, controls, (name, v) => (name === 'probes' && freeN ? freeN : v));   // a test's resolution is not saved
        if (perfOpen) p.set('perf', '1');
        replaceURL(p);
      }
      function loadURL() {
        const p = new URLSearchParams(location.search);
        readControls(p, controls);
        if (!PROBES.includes(hrc.pixelPerfect)) setProbes(PROBES.reduce((b, n) => (Math.abs(n - hrc.pixelPerfect) < Math.abs(b - hrc.pixelPerfect) ? n : b)));
        setSky(p.get('sky') ?? 'none');
        perfOpen = p.get('perf') === '1';
        return sceneFromURL(p, scenes);
      }

      // ════════════════════════════════════════════════════════════════════
      // Tools: fps / profile, load / save, screenshot, help
      // ════════════════════════════════════════════════════════════════════
      $('load-btn').addEventListener('click', () => $('scene-file').click());
      $('save-btn').addEventListener('click', () => hrc.saveScenePNG(`scene-${Date.now()}.png`));
      $('shot-btn').addEventListener('click', () => hrc.saveScreenshot(`hrc-${Date.now()}.png`));
      $('scene-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => {
          hrc.probeCount = img.width;
          hrc.loadSceneImage(img); // sets pixelPerfect to the image size
          changed();
        };
        img.src = URL.createObjectURL(file);
        e.target.value = '';
      });

      const KEYS = [
        ['← →', 'previous / next scene'],
        ['⇧ 0–9', 'scene 0–9'],
        ['0–9', 'pen colour (0 = eraser)'],
        ['+ −', 'pen size'],
        ['r', 'ratio'],
        ['p', 'shifted read'],
        ['e', 'equal footprints'],
        ['b', 'map: tone map / banded'],
        ['n', 'new shape'],
        ['⌫', 'delete selected shape'],
        ['c', 'clear drawing'],
        ['s', 'screenshot'],
        ['t', 'GPU profile table (console; profile open)'],
        ['f', 'fullscreen'],
        ['?', 'this help'],
      ];
      const help = $('help');
      KEYS.forEach(([k, d]) => help.append(el('div', { className: 'row' }, el('span', {}, ...k.split(' ').map((x) => el('kbd', { textContent: x }))), el('span', { textContent: d }))));
      const toggleHelp = (force) => {
        help.classList.toggle('open', force);
        $('help-btn').classList.toggle('on', help.classList.contains('open'));
      };
      $('help-btn').addEventListener('click', () => toggleHelp());

      // ── FPS; clicking it opens the GPU profile (site/_shared/profiler.ts) ──
      const fpsEl = $('fps');
      let avgFps = 0, avgGpu = 0;
      const showPerf = () => {
        if (hrc.profiler) hrc.profiler.enabled = perfOpen;
      };
      hrc.ready.then(() => {
        $('canvas-area').append(hrc.profiler.panel());
        showPerf();
      });
      fpsEl.addEventListener('click', () => {
        perfOpen = !perfOpen;
        showPerf();
        syncURL();
      });
      let lastFpsUpdate = 0;
      (function tick(now) {
        const gpuMs = perfOpen ? hrc.gpuTimeMs : 0, fps = hrc.fps;
        avgGpu = gpuMs > 0 ? avgGpu + (gpuMs - avgGpu) * 0.05 : 0;
        if (fps > 0) avgFps += (fps - avgFps) * 0.05;
        if (now - lastFpsUpdate > 250) {
          lastFpsUpdate = now;
          renderRefStatus();
          fpsEl.textContent = `${Math.round(avgFps)} fps${avgGpu > 0 ? ` · ${avgGpu.toFixed(1)} ms` : ''}`;
        }
        requestAnimationFrame(tick);
      })(0);

      // ════════════════════════════════════════════════════════════════════
      // Keyboard
      // ════════════════════════════════════════════════════════════════════
      const flip = (name) => {
        hrc[name] = !hrc[name];
        changed();
      };
      document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const t = e.target;
        if (t instanceof HTMLInputElement && (t.type === 'text' || ((t.type === 'range') && e.key.startsWith('Arrow')))) return;
        const d = e.code.match(/^Digit(\d)$/);
        if (d) {
          e.preventDefault();
          if (e.shiftKey) {
            switchScene(+d[1]);
            changed();
          } else if (!locked) pickPreset(+d[1]);
          return;
        }
        let handled = true;
        switch (e.key) {
          case 'r': case 'R': {
            const c = controls.find((x) => x.spec.label === 'ratio');
            c.spec.set(!hrc.ratio);
            changed();
            break;
          }
          case 'p': case 'P': flip('parityRead'); break;
          case 'e': case 'E': flip('equalise'); break;
          case 'b': case 'B': mapSet(mapGet() === 'tone' ? 'banded' : 'tone'); changed(); break;
          case '?': toggleHelp(); break;
          case 'Escape': toggleHelp(false); break;
          case '=': case '+': if (!locked) stepPenSize(1); break;
          case '-': case '_': if (!locked) stepPenSize(-1); break;
          case 'c': case 'C': if (!locked) hrc.clearLines(); break;
          case 's': case 'S': hrc.saveScreenshot(`hrc-${Date.now()}.png`); break;
          case 'f': case 'F':
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
            break;
          case 't': case 'T': {
            if (!hrc.profiler.enabled) {
              console.log('GPU profile is off: click the fps to open it');
              break;
            }
            const st = hrc.profiler.stats();
            console.table(st.passes.map(({ label, ms, min, count }) => ({ pass: label, ms: ms.toFixed(3), min: min.toFixed(3), count })));
            console.log(`GPU ${st.gpuMs.toFixed(2)} ms, span ${st.spanMs.toFixed(2)} ms, CPU encode ${st.cpuMs.toFixed(2)} ms (${st.frames} frames)`);
            break;
          }
          case 'ArrowRight': switchScene(currentScene + 1); changed(); break;
          case 'ArrowLeft': switchScene(currentScene - 1); changed(); break;
          case 'n': case 'N': {
            if (locked) break;
            const s = { x: -30, y: -30, width: 60, height: 60, rgb: [...pen.color], opacity: pen.opacity, albedo: pen.albedo };
            hrc.shapes.push(s);
            selectShape(s);
            break;
          }
          case 'Delete':
          case 'Backspace':
            if (!locked && selectedShape) (hrc.shapes.splice(hrc.shapes.indexOf(selectedShape), 1), selectShape(null));
            break;
          default:
            handled = false;
        }
        if (handled) {
          e.preventDefault();
          if (t !== document.body) t?.blur?.();
        }
      });

      // ════════════════════════════════════════════════════════════════════
      // Pen on the canvas (site/_shared/scene-panel.ts): drag a shape, or draw / erase on HRC's paint layer
      // ════════════════════════════════════════════════════════════════════
      const toClient = ([u, v]) => {
        const r = squareRect();
        return [r.left + (u / SCENE_SPAN + 0.5) * r.width, r.top + (v / SCENE_SPAN + 0.5) * r.height];
      };
      const eraserRadius = () => (pen.size / 2) * (squareRect().width / hrc.pixelPerfect); // screen px
      hrc.ready.then(() =>
        penPointer(hrc.canvas, {
          span: SCENE_SPAN,
          N: () => hrc.pixelPerfect,
          locked: () => locked,
          shapes: () => hrc.shapes,
          rect: (s) => [s.x, s.y, s.width, s.height],
          move: (s, x, y) => Object.assign(s, { x, y }),
          select: selectShape,
          eraser: () => pen.eraser,
          size: () => pen.size,
          paint: (a, b, _size, eraser) => {
            const [x0, y0] = toClient(a), [x1, y1] = toClient(b);
            if (eraser) hrc.eraseAt(x1, y1, eraserRadius());
            else hrc.addLine(x0, y0, x1, y1, pen.color, pen.size, pen.opacity, pen.albedo);
          },
          cursor: () => {},   // HRC moves its own pen light
          touch: () => {},   // HRC redraws every frame
        }),
      );
      // a click beside the square deselects
      $('canvas-area').addEventListener('pointerdown', (e) => {
        if (e.target === $('canvas-area') && selectedShape) selectShape(null);
      });

      // ── Init ──
      const initScene = loadURL();
      urlReady = true;
      showPerf();
      hrc.setMouseLightRadius(pen.size / 2);
      syncMouse();
      syncPen();
      refresh();
      switchScene(initScene);
    </script>
  </body>
</html>
