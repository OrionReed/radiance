<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital HRC</title>
    <meta name="description" content="HRC with exact falloff and digital lines" />
    <meta name="order" content="2" />
    <link rel="stylesheet" href="../_shared/page.css" />
    <style>
      /* panels */
      #right {
        border-left: 1px solid var(--line);
      }
      /* status / tools */
      #fps {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        margin-right: auto;
        cursor: pointer;
      }
      /* the GPU profile */
      .gpu-profiler {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 20;
      }
      /* the cascade's square (one canvas pixel per cell, scaled with nearest-neighbour sampling) */
      #view {
        position: absolute;
        image-rendering: pixelated;
        touch-action: none;
        cursor: crosshair;
      }
      #view.grab {
        cursor: grab;
      }
      #view.grabbing {
        cursor: grabbing;
      }
      /* two toggles side by side */
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
        margin-top: 10px;
      }
      .pair .field {
        margin-top: 0;
      }
      /* the scene locks while a reference is shown: no drawing or editing, and an outline around the square */
      body.locked #pen {
        opacity: 0.4;
        pointer-events: none;
      }
      body.locked #view {
        outline: 2px solid var(--lock);
        outline-offset: 3px;
        cursor: default;
      }
      #selection {
        position: absolute;
        display: none;
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #error {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        color: var(--dim);
        padding: 24px;
        text-align: center;
      }
      #error.open {
        display: grid;
      }
    </style>
  </head>
  <body>
    <aside id="left">
      <section>
        <h2>scene <small id="scene-id"></small></h2>
        <div id="scene-list"></div>
      </section>
      <section>
        <div id="scene-params"></div>
      </section>
      <section id="pen">
        <h2><span id="pen-title">pen</span> <small id="pen-sub"></small></h2>
        <div id="pen-fields"></div>
        <div id="size-field"></div>
      </section>
    </aside>

    <div id="canvas-area">
      <canvas id="view"></canvas>
      <div id="selection"></div>
      <div id="help"></div>
      <div id="error"></div>
    </div>

    <aside id="right">
      <section>
        <h2>cascade <small id="casc-info"></small></h2>
        <div id="features"></div>
      </section>
      <section>
        <h2>output</h2>
        <div id="output"></div>
        <div id="legend"></div>
      </section>
      <section id="tools">
        <span id="fps" title="Wall time of one solve and draw, averaged over edits. Click for the GPU profile." style="cursor: pointer"></span>
        <button id="bench-btn" title="Time the passes, a full frame and the draw at this N (table in the console)">bench</button>
        <button id="shot-btn" title="screenshot (s)">shot</button>
        <button id="help-btn" title="keyboard shortcuts (?)">?</button>
      </section>
    </aside>

    <script type="module">
      // Digital HRC page. Scenes are rectangles in scene units, rasterised on the CPU into emission E and transmittance A.
      import { DigitalHRC } from './digital-hrc.js';
      import { scenesFor, SPAN } from '../_shared/scenes';
      import { Reference } from '../_shared/reference';
      import { Profiler } from '../_shared/profiler';
      import { DISPLAY_WGSL, EXPOSURE, EXPOSURE_CONTROL, BANDED_LEGEND, MAP_CONTROL, MAP_INDEX } from '../_shared/display';
      import { $, el, createControls, fieldFor, writeControls, readControls, sceneFromURL, replaceURL } from '../_shared/ui';
      import { DRAW_WGSL } from '../_shared/draw';
      import { outputPanel, EXACT_DENSITY } from '../_shared/output-panel';
      import { sceneList, penPointer, PEN_SIZES, nextPenSize } from '../_shared/scene-panel';

      const view = $('view');

      // State. cfg rebuilds the cascade when it changes; out only redraws.
      const cfg = { N: 256, splitRule: 'balanced' };
      const out = { scene: false, map: 'tone', stops: 0 };
      // reference view: 0 none (the scheme itself), 1 path trace, 2 exact, 3 error against the path trace, 4 against exact.
      // The scene locks while one is shown.
      let refMode = 0, reference = null, drawnVersion = -1;
      const locked = () => refMode !== 0;
      const pathTracing = () => refMode === 1 || refMode === 3;

      let dirty = true, redraw = true;
      const touch = () => (dirty = true);

      // Controls. Each spec: { label, get(), set(v), enabled?(), key?, title?, url?: [name, default] }.
      const { controls, toggle, segmented, slider, pill, syncControls } = createControls(() => changed());
      const field = fieldFor(() => touch());
      function refresh() {
        syncControls();
        renderLegend();
      }
      function changed() {
        refresh();
        syncURL();
      }

      // Materials (mono): luminance S is the radiance. Opacity is per cell at N = 256, so a scene looks the same at every N:
      // sigma = -ln(1 - opacity) 256 / N, A = e^-sigma, E = S sigma. Opacity 1 is solid (A = 0), with light S on its faces.
      const lum = ([r, g, b]) => 0.2126 * r + 0.7152 * g + 0.0722 * b;
      const REF = 256;
      const material = (rgb, opacity, N) => {
        const S = lum(rgb);
        if (opacity <= 0) return { e: (S * REF) / N, a: 1 };
        if (opacity >= 1) return { e: S, a: 0 };
        const sig = (-Math.log(1 - opacity) * REF) / N;
        return { e: S * sig, a: Math.exp(-sig) };
      };

      // Scenes: the shared set (site/_shared/scenes.ts). A shape here is { x, y, w, h, rgb, opacity } in scene units
      // (top-left, y down; rgb grey, its luminance the brightness). Tests impose their resolution while they are shown.
      let shapes = [], strokes = [];
      const scenes = scenesFor({ volumes: true });

      // scene switching (site/_shared/scene-panel.ts)
      const sceneUI = sceneList({
        list: $('scene-list'),
        label: $('scene-id'),
        scenes,
        resolution: { get: () => cfg.N, set: (n) => (cfg.N = n) },
        load: (s) => {
          shapes = s.shapes.map(({ x, y, w, h, brightness: b, opacity }) => ({ x, y, w, h, rgb: [b, b, b], opacity }));
          strokes = [];
          selectShape(null);
        },
        after: () => (touch(), syncURL()),
        changed: () => changed(),
      });
      const switchScene = sceneUI.switchTo;

      // Rasterisation: cell (gx, gy), gy down, is index gx N + (N - 1 - gy) (y up).
      let E = null, A = null, cursor = null;
      const raster = { snap: false };
      function rasterise(N) {
        E.fill(0);
        A.fill(1);
        const k = N / SPAN, g = (u) => (u + SPAN / 2) * k;
        const cellIndex = (gx, gy) => (gx < 0 || gy < 0 || gx >= N || gy >= N ? -1 : gx * N + (N - 1 - gy));
        // whole cells: the material replaces what is there
        const put = (gx, gy, m) => {
          const i = cellIndex(gx, gy);
          if (i >= 0) ((E[i] = m.e), (A[i] = m.a));
        };
        // unsnapped: the material covers a fraction c of the cell; emission mixes by area, volumes by optical depth. Solids
        // take the whole cell when they cover its centre, else nothing, so a thin wall never lets light through.
        const OPAQUE = 0.01;
        const over = (i, m, c, centre) => {
          if (m.a < OPAQUE) return centre ? ((E[i] = m.e), (A[i] = m.a)) : undefined;
          E[i] = E[i] * (1 - c) + m.e * c;
          if (A[i] >= OPAQUE) A[i] = A[i] ** (1 - c) * m.a ** c;
        };
        const overlap = (a0, a1, c) => Math.max(0, Math.min(a1, c + 1) - Math.max(a0, c));
        const coverBox = (x0, x1, y0, y1, cover) => {
          for (let x = Math.floor(x0); x < Math.ceil(x1); x++)
            for (let y = Math.floor(y0); y < Math.ceil(y1); y++) {
              const c = overlap(x0, x1, x) * overlap(y0, y1, y), i = cellIndex(x, y);
              const centre = x + 0.5 >= x0 && x + 0.5 < x1 && y + 0.5 >= y0 && y + 0.5 < y1;
              if (c > 0 && i >= 0) cover(i, c, centre);
            }
        };
        // a brush of `size` cells swept from a to b: each cell takes its largest coverage along the way
        const sweep = (ax, ay, bx, by, size, m) => {
          if (raster.snap) {
            const lo = (c) => Math.round(c - size / 2), n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) * 2)), sz = Math.max(1, Math.round(size));
            for (let t = 0; t <= n; t++) {
              const cx = ax + ((bx - ax) * t) / n, cy = ay + ((by - ay) * t) / n;
              for (let x = lo(cx); x < lo(cx) + sz; x++) for (let y = lo(cy); y < lo(cy) + sz; y++) put(x, y, m);
            }
            return;
          }
          const cov = new Map(), n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) * 4)), h = size / 2;
          for (let t = 0; t <= n; t++) {
            const cx = ax + ((bx - ax) * t) / n, cy = ay + ((by - ay) * t) / n;
            coverBox(cx - h, cx + h, cy - h, cy + h, (i, c, centre) => {
              const [c0, in0] = cov.get(i) ?? [0, false];
              cov.set(i, [Math.max(c, c0), centre || in0]);
            });
          }
          for (const [i, [c, centre]] of cov) over(i, m, c, centre);
        };
        for (const s of shapes) {
          const m = material(s.rgb, s.opacity, N);
          let [x0, x1, y0, y1] = [g(s.x), g(s.x + s.w), g(s.y), g(s.y + s.h)];
          // solid shapes are at least one cell thick (thinner would cover no cell centre)
          const widen = (a, b) => (b - a >= 1 ? [a, b] : [(a + b) / 2 - 0.5, (a + b) / 2 + 0.5]);
          if (m.a < OPAQUE || raster.snap) [[x0, x1], [y0, y1]] = [widen(x0, x1), widen(y0, y1)];
          if (!raster.snap) {
            coverBox(x0, x1, y0, y1, (i, c, centre) => over(i, m, c, centre));
            continue;
          }
          for (let x = Math.round(x0); x < Math.round(x1); x++) for (let y = Math.round(y0); y < Math.round(y1); y++) put(x, y, m);
        }
        for (const s of strokes) sweep(g(s.x0), g(s.y0), g(s.x1), g(s.y1), s.size * k, material(s.rgb, s.opacity, N));
        if (cursor && pen.kind !== 'eraser' && !pointer.dragging()) {
          const m = penMaterial(), cx = g(cursor[0]), cy = g(cursor[1]);
          sweep(cx, cy, cx, cy, pen.size, material(m.rgb, m.opacity, N));
        }
      }

      // Pen and shape inspector. A material is a brightness (radiance) and an opacity; the kinds only set defaults.
      // Shapes and strokes store { rgb, opacity } (mono: rgb grey).
      const KINDS = [
        ['light', 'light', 'solid and glowing'],
        ['solid', 'solid', 'solid and dark'],
        ['volume', 'medium', 'see-through: absorbs, and glows if bright'],
        ['eraser', 'eraser', 'erase strokes'],
      ];
      const KIND_DEFAULTS = { light: { brightness: 0.8, opacity: 1 }, solid: { brightness: 0, opacity: 1 }, volume: { brightness: 0, opacity: 0.1 } };
      const pen = { kind: 'light', brightness: 0.8, opacity: 1, size: 2 };
      let selected = null;
      const kindOf = (m) => (m.opacity < 1 ? 'volume' : lum(m.rgb) > 0 ? 'light' : 'solid');
      const materialOf = ({ brightness: b, opacity }) => ({ rgb: [b, b, b], opacity });
      const penMaterial = () => materialOf(pen);
      const shapeState = (s) => ({ kind: kindOf(s), brightness: lum(s.rgb), opacity: s.opacity });
      const setPenSize = (v) => ((pen.size = v), touch(), refresh());
      const stepPenSize = (d) => setPenSize(nextPenSize(pen.size, d));
      const setPen = (key, v) => {
        if (selected && v === 'eraser') return;
        const st = selected ? shapeState(selected) : pen;
        if (key === 'kind') Object.assign(st, { kind: v }, KIND_DEFAULTS[v]);
        else st[key] = v;
        if (selected) Object.assign(selected, materialOf(st));
        touch();
      };
      // the kind shown is the one the material is, unless the pen erases
      const penGet = (key) => (selected ? shapeState(selected)[key] : key === 'kind' && pen.kind !== 'eraser' ? kindOf(penMaterial()) : pen[key]);
      segmented($('pen-fields'), { cols: 3, options: KINDS, get: () => penGet('kind'), set: (k) => setPen('kind', k) });
      slider($('pen-fields'), {
        label: 'brightness',
        title: 'radiance of a light\'s faces, or of a thick volume',
        min: 0, max: 2, step: 0.01,
        get: () => penGet('brightness'), set: (v) => setPen('brightness', v), format: (v) => v.toFixed(2),
        enabled: () => penGet('kind') !== 'eraser',
      });
      slider($('pen-fields'), {
        label: 'opacity',
        title: 'per pixel at N = 256: 0 see-through, 1 solid',
        min: 0, max: 1, step: 0.01,
        get: () => Math.cbrt(penGet('opacity')), set: (v) => setPen('opacity', v ** 3),
        format: (v) => { const o = v ** 3; return o > 0 && o < 0.1 ? o.toFixed(3) : o.toFixed(2); },
        enabled: () => penGet('kind') !== 'eraser',
      });
      function syncPen() {
        $('pen-title').textContent = selected ? 'shape' : 'pen';
        $('pen-sub').textContent = selected ? 'selected · ⌫ deletes · esc' : '';
        $('size-field').style.display = selected ? 'none' : '';
        refresh();
      }
      function selectShape(s) {
        selected = s;
        syncPen();
      }

      // Panels
      const PROBES = [64, 128, 256, 512, 1024];
      segmented($('scene-params'), { label: 'resolution', title: 'tests set their own', options: PROBES.map((n) => [n, String(n)]), ...field(cfg, 'N'), enabled: () => !scenes[sceneUI.current].N, url: ['N', 256] });
      toggle($('scene-params'), {
        label: 'snap to grid',
        title: 'shapes take whole pixels; off, volumes cover pixels by area',
        ...field(raster, 'snap'),
        url: ['snap', false],
      });
      segmented($('size-field'), { label: 'size', options: PEN_SIZES.map((n) => [n, String(n)]), get: () => pen.size, set: setPenSize });

      const F = $('features');
      segmented(F, {
        label: 'split rule',
        title: 'how a ray of odd rise splits into halves',
        options: [['balanced', 'balanced'], ['alternating', 'alternating']],
        ...field(cfg, 'splitRule'),
        url: ['splitRule', 'balanced'],
      });

      // the output panel (site/_shared/output-panel.ts)
      const output = outputPanel($('output'), {
        controls: { segmented, slider, pill },
        display: out,
        redraw: () => (redraw = true),
        reference: { get: () => refMode, set: setReference },
        referenceTitle: 'a reference of the same scene, or Digital HRC\'s difference from it; the scene locks while one is shown',
        sceneTitle: 'lights red, solids blue, volumes tinted by opacity',
        errorScheme: () => 'Digital HRC',
      });
      function renderLegend() {
        output.legend($('legend'));
      }

      // URL state: every control with url: [name, default], plus scene and perf.
      let perfOpen = false, urlReady = false;
      function syncURL() {
        if (!urlReady) return;
        const p = new URLSearchParams();
        if (sceneUI.current !== 0) p.set('scene', scenes[sceneUI.current].id);
        writeControls(p, controls, (name, v) => (name === 'N' && sceneUI.freeN ? sceneUI.freeN : v));   // a test's resolution is not saved
        if (perfOpen) p.set('perf', '1');
        replaceURL(p);
      }
      function loadURL() {
        const p = new URLSearchParams(location.search);
        readControls(p, controls);
        if (!PROBES.includes(cfg.N)) cfg.N = 256;
        perfOpen = p.get('perf') === '1';
        return sceneFromURL(p, scenes);
      }

      // WebGPU: the cascade (rebuilt when cfg changes) and a draw pass from its fluence buffer.
      const fail = (msg) => {
        $('error').textContent = msg;
        $('error').classList.add('open');
      };
      const adapter = await navigator.gpu?.requestAdapter();
      if (!adapter) {
        fail('WebGPU is not available in this browser.');
        throw new Error('no WebGPU');
      }
      const device = await adapter.requestDevice({
        requiredFeatures: Profiler.features(adapter),
        requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize },
      });
      // GPU profile (off until the fps is clicked): while on, the cascade is solved every frame
      const profiler = new Profiler(device);
      $('canvas-area').append(profiler.panel());
      device.addEventListener('uncapturederror', (e) => {
        console.error(e.error.message);
        fail(e.error.message);
      });
      const ctx = view.getContext('webgpu');
      const format = navigator.gpu.getPreferredCanvasFormat();
      ctx.configure({ device, format, alphaMode: 'opaque' });

      const drawModule = device.createShaderModule({
        code: /* wgsl */ `
        @group(0) @binding(0) var<storage, read> F: array<f32>;
        @group(0) @binding(1) var<storage, read> A: array<f32>;
        @group(0) @binding(2) var<storage, read> E: array<f32>;
        struct Draw {
          P: vec4f,   // N, exposure / 2 pi (fluence to mean radiance), map (0 tone map, 1 banded), reference view
          Q: vec4f,   // canvas size in device pixels, unused, scene (0 / 1)
          R: vec4f,   // error clip (errors of at least it show magenta), unused
        }
        @group(0) @binding(3) var<uniform> D: Draw;
        @group(0) @binding(4) var<storage, read> R: array<f32>;   // the reference's radiance per pixel
        ${DISPLAY_WGSL}
        ${DRAW_WGSL}
        fn srgb(c: vec3f) -> vec3f { return srgbEncode(c); }
        @fragment fn fs(@builtin(position) q: vec4f) -> @location(0) vec4f {
          let P = D.P;
          let N = i32(P.x); let cell = vec2i(floor(q.xy / D.Q.xy * P.x));
          let i = cell.x * N + (N - 1 - cell.y);
          let a = A[i]; let e = E[i]; let fs = max(F[i], 0.0);
          let fr = R[i] * 6.2831853;   // the reference, as fluence
          let mode = i32(P.w);
          let f = select(fr, fs, mode == 0) * P.y;
          if (mode >= 3) {   // error views; solids show the scene's colours when it is on, else white
            if (a > 0.0) { return vec4f(errorColour(fs, fr, P.y, D.R.x), 1.0); }
            return vec4f(select(vec3f(1.0), select(vec3f(0.15, 0.3, 1.0), vec3f(1.0, 0.2, 0.15), e > 0.0), D.Q.w > 0.5), 1.0);
          }
          var S = 0.0;   // the material's radiance, from E and A (see material() in the page)
          if (e > 0.0) { S = select(select(e, e / max(-log(a), 1e-6), a < 1.0), e, a <= 0.0); }
          let opaque = a <= 0.0;   // solids: lights show their radiance, the rest dark slate
          let tint = D.Q.w > 0.5;   // the scene: lights red, solids blue, volumes by opacity
          if (opaque) {
            if (e > 0.0) { return vec4f(select(srgb(vec3f(min(1.0, S * 1.25))), vec3f(1.0, 0.2, 0.15), tint), 1.0); }
            return vec4f(select(vec3f(0.11, 0.115, 0.13), vec3f(0.15, 0.3, 1.0), tint), 1.0);
          }
          var c = displayed(vec3f(f), P.z);
          if (tint) {
            if (e > 0.0) { c = mix(c, vec3f(1.0, 0.2, 0.15), 0.7); }
            else if (a < 1.0) { c = mix(c, vec3f(0.15, 0.3, 1.0), 0.25 + 0.6 * (1.0 - a)); }
          }
          return dither(c, q.xy);
        }`,
      });
      const drawPipe = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: drawModule, entryPoint: 'vertexMain' },
        fragment: { module: drawModule, entryPoint: 'fs', targets: [{ format }] },
        primitive: { topology: 'triangle-list' },
      });
      const drawU = device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

      let cascade = null, cascadeKey = '';
      function engine() {
        const key = JSON.stringify(cfg);
        if (key === cascadeKey) return cascade;
        if (cascade) for (const v of Object.values(cascade)) if (v instanceof GPUBuffer) v.destroy();
        const N = cfg.N;
        cascade = new DigitalHRC(device, N, { splitRule: cfg.splitRule });
        cascade.profiler = profiler;
        profiler.reset();
        cascadeKey = key;
        if (reference?.N !== N) {   // the reference depends on the scene and N only, not on the scheme's settings
          reference?.destroy();
          reference = new Reference(device, N, { probes: 'cell' });   // pixel means, like the scheme's output
        }
        E = new Float32Array(N * N);
        A = new Float32Array(N * N);
        const mb = (cascade.rayBuffer.size + cascade.beyondSampleBuffer.size) / 2 ** 20;
        $('casc-info').textContent = `${N}² · ${mb.toFixed(0)} MB`;
        layout();
        return cascade;
      }
      function encodeDraw(enc, g, timestampWrites) {
                device.queue.writeBuffer(drawU, 0, new Float32Array([
          g.N, (EXPOSURE * 2 ** out.stops) / (2 * Math.PI), MAP_INDEX[out.map], refMode,
          view.width, view.height, 0, out.scene ? 1 : 0,
          output.clip(), 0, 0, 0,
        ]));
        const R = pathTracing() ? reference.pathTraceOutput : reference.exactOutput;
        const drawBG = device.createBindGroup({
          layout: drawPipe.getBindGroupLayout(0),
          entries: [g.fluenceBuffer, g.transmittanceBuffer, g.emissionBuffer, drawU, R].map((buffer, binding) => ({ binding, resource: { buffer } })),
        });
        const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }], timestampWrites });
        pass.setPipeline(drawPipe);
        pass.setBindGroup(0, drawBG);
        pass.draw(3);
        pass.end();
      }

      // reference
      function setReference(v) {
        refMode = v;
        document.body.classList.toggle('locked', locked());
        if (locked()) ((cursor = null), selectShape(null));
        if (!(refMode === 2 || refMode === 4)) reference?.pauseExact();
        touch();   // solve again (without the cursor's light) and give the reference this scene
      }
      function renderRefStatus() {
        output.status(reference);
      }
      // the reference's input: radiance and transmittance per pixel (see site/_shared/reference.ts)
      function uploadReference() {
        const S = new Float32Array(E.length);
        for (let i = 0; i < E.length; i++) S[i] = A[i] > 0 && A[i] < 1 ? E[i] / -Math.log(A[i]) : E[i];
        reference.upload(S, A);
      }

      // layout: the largest square in the canvas area, 32 px margin
      const squareRect = () => view.getBoundingClientRect();
      function layout() {
        const r = $('canvas-area').getBoundingClientRect();
        const d = Math.max(64, Math.floor(Math.min(r.width - 64, r.height - 64)));
        Object.assign(view.style, { width: d + 'px', height: d + 'px', left: Math.floor((r.width - d) / 2) + 'px', top: Math.floor((r.height - d) / 2) + 'px' });
        view.width = view.height = Math.round(d * (window.devicePixelRatio || 1)); // drawn at device resolution: crisp cells, per-pixel dither
        redraw = true;
      }
      window.addEventListener('resize', layout);

      // frame loop: recompute only when the scene changed, redraw when the output settings changed
      let busy = false, cpuMs = 0, gpuMs = 0, solves = 0, frameMs = 0, solveN = 0;
      // the selected shape's outline, in CSS pixels over the canvas
      function placeSelection() {
        const box = $('selection');
        box.style.display = selected ? 'block' : 'none';
        if (!selected) return;
        const k = view.clientWidth / SPAN;
        Object.assign(box.style, {
          left: `${view.offsetLeft + (selected.x + SPAN / 2) * k - 1}px`, top: `${view.offsetTop + (selected.y + SPAN / 2) * k - 1}px`,
          width: `${selected.w * k + 2}px`, height: `${selected.h * k + 2}px`,
        });
      }
      async function frame() {
        requestAnimationFrame(frame);
        placeSelection();
        if (refMode && reference && (reference.version !== drawnVersion || (pathTracing() && reference.pathTraceFrames < 1024))) redraw = true;
        if (busy || !(dirty || redraw || profiler.enabled)) return;
        busy = true;
        const scene = dirty, solve = dirty || profiler.enabled;
        dirty = redraw = false;
        const fresh = cascade === null || JSON.stringify(cfg) !== cascadeKey;
        const g = engine();
        const t0 = performance.now();
        if (scene) {
          rasterise(g.N);
          g.upload(E, A);
        }
        profiler.beginFrame();
        const enc = device.createCommandEncoder();
        if (solve) g.encodeAll(enc);
        if (refMode) {
          if (scene) uploadReference();
          if (pathTracing() && reference.pathTraceFrames < 1024) reference.encodePathTrace(enc);
          if (refMode === 2 || refMode === 4) reference.startExact(EXACT_DENSITY * g.N);
          drawnVersion = reference.version;
          renderRefStatus();
        }
        const t1 = performance.now();
        encodeDraw(enc, g, profiler.timestampWrites('draw'));
        profiler.endFrame(enc);
        device.queue.submit([enc.finish()]);
        profiler.collect();
        await device.queue.onSubmittedWorkDone();
        if (scene && !fresh) {   // the first solve after a rebuild includes pipeline compilation
          cpuMs = t1 - t0;
          gpuMs = performance.now() - t1;
          frameMs = solveN === g.N ? frameMs + (cpuMs + gpuMs - frameMs) * 0.3 : cpuMs + gpuMs;   // restart at a new N
          solveN = g.N;
          solves++;
        }
        busy = false;
      }

      // Tools: fps / perf, screenshot, help
      function screenshot() {
        const g = engine(), enc = device.createCommandEncoder();
        encodeDraw(enc, g);
        device.queue.submit([enc.finish()]);
        view.toBlob((b) => b && Object.assign(document.createElement('a'), { href: URL.createObjectURL(b), download: `digital-hrc-${scenes[sceneUI.current].id}-${g.N}-${Date.now()}.png` }).click());
      }
      $('shot-btn').addEventListener('click', screenshot);

      // bench: each case 20 times, waiting for the GPU each time (latency, as an interactive frame sees it)
      let benching = false;
      async function bench() {
        if (benching) return;
        benching = true;
        while (busy) await new Promise((r) => setTimeout(r, 5));
        busy = true;
        fpsEl.textContent = 'benching…';
        const g = engine(), reps = 20;
        const time = async (fn) => {
          await device.queue.onSubmittedWorkDone();
          const t0 = performance.now();
          for (let r = 0; r < reps; r++) {
            const enc = device.createCommandEncoder();
            fn(enc);
            device.queue.submit([enc.finish()]);
            await device.queue.onSubmittedWorkDone();
          }
          return (performance.now() - t0) / reps;
        };
        rasterise(g.N);
        g.upload(E, A); // the current scene (the cascade's cost depends on its content)
        await time((enc) => g.encodeAll(enc)); // warm-up
        const passes = await time((enc) => g.encodeAll(enc));
        const frame = await time((enc) => (rasterise(g.N), g.upload(E, A), g.encodeAll(enc), encodeDraw(enc, g)));
        const draw = await time((enc) => encodeDraw(enc, g));
        const upload = await time(() => g.upload(E, A));
        let t0 = performance.now();
        for (let r = 0; r < reps; r++) rasterise(g.N);
        const raster = (performance.now() - t0) / reps;
        const r = { N: g.N, 'passes (ms)': +passes.toFixed(2), 'full frame (ms)': +frame.toFixed(2), 'draw only (ms)': +draw.toFixed(2),
          'upload (ms)': +upload.toFixed(2), 'raster, CPU (ms)': +raster.toFixed(2), canvas: `${view.width}²` };
        console.table([r]);
        fpsEl.textContent = `${g.N}²: passes ${passes.toFixed(1)} · frame ${frame.toFixed(1)} (raster ${raster.toFixed(1)}, upload ${upload.toFixed(1)}) ms`;
        busy = false;
        setTimeout(() => (benching = false), 6000); // keep the result on screen for a while
      }
      $('bench-btn').addEventListener('click', bench);

      const KEYS = [
        ['← →', 'previous / next scene'],
        ['⇧ 0–9', 'scene 0–9'],
        ['1–4', 'pen: light, solid, volume, eraser'],
        ['+ −', 'pen size'],
        ['b', 'next map'],
        ['v', 'scene (lights red, solids blue)'],
        ['n', 'new shape'],
        ['⌫', 'delete selected shape'],
        ['c', 'clear drawing'],
        ['s', 'screenshot'],
        ['t', 'GPU stage timings (console)'],
        ['f', 'fullscreen'],
        ['?', 'this help'],
      ];
      const help = $('help');
      KEYS.forEach(([k, d]) => help.append(el('div', { className: 'row' }, el('span', {}, ...k.split(' ').map((x) => el('kbd', { textContent: x }))), el('span', { textContent: d }))));
      const toggleHelp = (force) => {
        help.classList.toggle('open', force);
        $('help-btn').classList.toggle('on', help.classList.contains('open'));
      };
      $('help-btn').addEventListener('click', () => toggleHelp());

      // fps; clicking it opens the GPU profile (site/_shared/profiler.ts)
      const fpsEl = $('fps');
      const toggleProfile = (on = !perfOpen) => {
        perfOpen = profiler.enabled = on;
        syncURL();
      };
      fpsEl.addEventListener('click', () => toggleProfile());
      setInterval(() => {
        if (benching) return;
        fpsEl.textContent = profiler.enabled ? `${cfg.N}² · GPU ${profiler.stats().gpuMs.toFixed(1)} ms, profiled`
          : solveN === cfg.N ? `${solveN}² · ${frameMs.toFixed(1)} ms wall` : `${cfg.N}² · move to time`;
      }, 250);

      // Keyboard
      document.addEventListener('keydown', async (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const t = e.target;
        if (t instanceof HTMLInputElement && (t.type === 'text' || (t.type === 'range' && e.key.startsWith('Arrow')))) return;
        const d = e.code.match(/^Digit(\d)$/);
        if (d) {
          e.preventDefault();
          if (e.shiftKey) {
            switchScene(+d[1]);
            changed();
          } else if (!locked() && +d[1] >= 1 && +d[1] <= KINDS.length) (selectShape(null), setPen('kind', KINDS[+d[1] - 1][0]), refresh());
          return;
        }
        let handled = true;
        switch (e.key) {
          case 'v': case 'V': out.scene = !out.scene; redraw = true; changed(); break;
          case 'b': case 'B': out.map = out.map === 'tone' ? 'banded' : 'tone'; redraw = true; changed(); break;
          case '?': toggleHelp(); break;
          case 'Escape': toggleHelp(false); selectShape(null); break;
          case '=': case '+': stepPenSize(1); break;
          case '-': case '_': stepPenSize(-1); break;
          case 'c': case 'C': if (!locked()) ((strokes = []), touch()); break;
          case 's': case 'S': screenshot(); break;
          case 'f': case 'F':
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
            break;
          case 't': case 'T': {
            const r = await engine().profile(10);
            console.table(Object.entries(r).map(([stage, ms]) => ({ stage, ms: ms.toFixed(3) })));
            console.log(`one quadrant: ${Object.values(r).reduce((a, b) => a + b, 0).toFixed(2)} ms (×4 for a frame)`);
            break;
          }
          case 'ArrowRight': switchScene(sceneUI.current + 1); changed(); break;
          case 'ArrowLeft': switchScene(sceneUI.current - 1); changed(); break;
          case 'n': case 'N':
            if (locked()) break;
            shapes.push({ x: -30, y: -30, w: 60, h: 60, ...(pen.kind === 'eraser' ? { rgb: [0, 0, 0], opacity: 1 } : penMaterial()) });
            selectShape(shapes.at(-1));
            touch();
            break;
          case 'Delete':
          case 'Backspace':
            if (selected) {
              shapes = shapes.filter((s) => s !== selected);
              selectShape(null);
              touch();
            }
            break;
          default:
            handled = false;
        }
        if (handled) {
          e.preventDefault();
          if (t !== document.body) t?.blur?.();
        }
      });

      // Pointer: drag a shape (topmost under the pointer), or draw / erase strokes; the cursor is a pen-material light
      const pointer = penPointer(view, {
        span: SPAN,
        N: () => cfg.N,
        locked,
        shapes: () => shapes,
        rect: (s) => [s.x, s.y, s.w, s.h],
        move: (s, x, y) => Object.assign(s, { x, y }),
        select: selectShape,
        eraser: () => pen.kind === 'eraser',
        size: () => pen.size,
        strokes: { get: () => strokes, set: (s) => (strokes = s), material: () => penMaterial() },
        cursor: (p) => (cursor = p),
        touch,
      });
      // a click beside the square deselects
      $('canvas-area').addEventListener('pointerdown', (e) => {
        if (e.target === $('canvas-area')) selectShape(null);
      });

      // hooks for scripts
      window.digitalHRC = { cfg, out, device, engine, touch, bench, profiler, reference: () => reference, stats: () => ({ cpuMs, gpuMs, solves, frameMs }), scene: () => ({ shapes, strokes, E, A }) };

      // init
      const initScene = loadURL();
      urlReady = true;
      if (perfOpen) toggleProfile(true);
      syncPen();
      refresh();
      layout();
      switchScene(initScene);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
