<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascade plots</title>
    <meta name="description" content="Diagrams of cascades, rays and merges" />
    <meta name="section" content="visualisations" />
    <link rel="stylesheet" href="../_shared/page.css" />
    <style>
      body { grid-template-columns: 260px minmax(0, 1fr); }
      #plot { position: absolute; inset: 14px; border-radius: 3px; overflow: hidden; background: var(--fig-bg, #f4f1e9); display: flex; flex-direction: column; color: #1d1d1b; }
      #plot[data-theme='chalk'] { color: #ecebe3; }
      #plot header { padding: 14px 20px 0; font: 13px/1.4 ui-monospace, 'SF Mono', monospace; }
      #plot[data-theme='chalk'] header { font-family: Chalkduster, 'Chalkboard SE', 'Bradley Hand', 'Comic Sans MS', cursive; }
      #plot header h1 { margin: 0; font-size: 15px; font-weight: 600; }
      #plot header p { margin: 3px 0 0; opacity: 0.72; }
      #figure { position: relative; flex: 1; min-height: 0; overflow: hidden; }
      #figure svg { display: block; }
      .about { margin: 10px 0 12px; color: var(--dim); font-size: 11px; line-height: 1.45; }
      .info { margin: 12px 0 0; font: 10.5px/1.5 var(--mono); color: var(--dim); white-space: pre-wrap; }
      .action { width: 100%; font: inherit; font-size: 11px; color: var(--text); background: var(--ctl); border: 0; border-radius: 6px; padding: 6px; cursor: pointer; }
      .action:hover { background: var(--ctl-hover); }
    </style>
  </head>
  <body>
    <aside id="left"></aside>
    <main id="canvas-area">
      <div id="plot">
        <header><h1 id="fig-title"></h1><p id="fig-question"></p></header>
        <div id="figure"></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
